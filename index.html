<!DOCTYPE html>
<html lang="es-CO">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#0a1128">
<title>Academia Piloto IA</title>
<style>
/* ============ RESET / BASE ============ */
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{
  --night:#070d20; --night2:#0c1738; --panel:#111f45; --panel2:#16265a;
  --line:rgba(120,160,255,.16);
  --cyan:#22d3ee; --cyan2:#0ea5c4; --amber:#fbbf24; --amber2:#f59e0b;
  --green:#34d399; --greenD:#0f5132; --red:#fb7185; --redD:#4c1d24;
  --ink:#eaf1ff; --dim:#9fb2d8; --dim2:#6b7ba8;
  --grad:linear-gradient(135deg,#22d3ee,#3b82f6); --gradA:linear-gradient(135deg,#fbbf24,#f97316);
  --r:18px; --sh:0 10px 30px rgba(0,0,0,.35);
}
html,body{height:100%}
body{
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  background:radial-gradient(1200px 700px at 80% -10%,#13245c 0%,transparent 60%),radial-gradient(900px 600px at 0% 10%,#0b2340 0%,transparent 55%),var(--night);
  color:var(--ink);-webkit-font-smoothing:antialiased;overflow-x:hidden;
  user-select:none;
}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
.app{max-width:560px;margin:0 auto;min-height:100vh;position:relative;padding-bottom:84px}

/* ============ TOP BAR ============ */
.topbar{position:sticky;top:0;z-index:30;background:linear-gradient(180deg,rgba(7,13,32,.96),rgba(7,13,32,.75));
  backdrop-filter:blur(8px);padding:12px 16px;display:flex;align-items:center;gap:10px;border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:9px;font-weight:800;font-size:15px;letter-spacing:.3px}
.brand .logo{width:30px;height:30px;border-radius:9px;background:var(--grad);display:grid;place-items:center;font-size:17px;box-shadow:0 4px 14px rgba(34,211,238,.4)}
.stat{display:flex;align-items:center;gap:5px;font-weight:800;font-size:14px;padding:6px 10px;border-radius:999px;background:var(--panel);border:1px solid var(--line)}
.stat.xp{color:var(--amber)} .stat.streak{color:#ff9d5c}
.spacer{flex:1}
.iconbtn{width:38px;height:38px;border-radius:11px;background:var(--panel);border:1px solid var(--line);display:grid;place-items:center;font-size:17px}

/* ============ SCREENS ============ */
.screen{display:none;padding:16px;animation:fade .35s ease}
.screen.active{display:block}
@keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

/* ============ RANK CARD ============ */
.rankcard{background:linear-gradient(135deg,#16265a,#0c1738);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:flex;align-items:center;gap:14px;box-shadow:var(--sh);position:relative;overflow:hidden}
.rankcard::after{content:"";position:absolute;right:-30px;top:-30px;width:130px;height:130px;background:radial-gradient(circle,rgba(34,211,238,.25),transparent 70%)}
.avatar{width:60px;height:60px;border-radius:16px;background:var(--gradA);display:grid;place-items:center;font-size:34px;flex-shrink:0;box-shadow:0 6px 18px rgba(245,158,11,.35);animation:bob 3s ease-in-out infinite}
@keyframes bob{0%,100%{transform:translateY(0) rotate(-2deg)}50%{transform:translateY(-5px) rotate(2deg)}}
.rankinfo{flex:1;min-width:0}
.rankinfo .who{font-size:13px;color:var(--dim)}
.rankinfo .rank{font-size:20px;font-weight:800;line-height:1.1}
.rankinfo .rank b{background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
.progbar{height:9px;border-radius:999px;background:rgba(0,0,0,.35);margin-top:8px;overflow:hidden}
.progbar i{display:block;height:100%;background:var(--gradA);border-radius:999px;transition:width .8s cubic-bezier(.2,.9,.3,1)}
.rankinfo .next{font-size:11px;color:var(--dim2);margin-top:4px}

/* ============ CAPI SPEECH ============ */
.capi{display:flex;gap:11px;align-items:flex-start;margin:16px 0;background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:12px 14px;box-shadow:var(--sh)}
.capi .face{width:42px;height:42px;border-radius:12px;background:linear-gradient(135deg,#22c55e,#0891b2);display:grid;place-items:center;font-size:24px;flex-shrink:0;animation:bob 3.4s ease-in-out infinite}
.capi .bub{font-size:13.5px;line-height:1.45;color:var(--ink)}
.capi .bub b{color:var(--cyan)}

/* ============ PATH / MAP ============ */
.leveltitle{display:flex;align-items:center;gap:10px;margin:22px 2px 6px}
.leveltitle .num{width:30px;height:30px;border-radius:9px;background:var(--panel2);border:1px solid var(--line);display:grid;place-items:center;font-weight:800;font-size:14px;color:var(--cyan)}
.leveltitle h3{font-size:16px;font-weight:800}
.leveltitle .sub{font-size:11.5px;color:var(--dim2)}
.leveltitle.locked{opacity:.55}
.path{position:relative;padding:6px 0 4px}
.node{position:relative;display:flex;align-items:center;gap:14px;padding:8px 4px}
.node .dot{width:60px;height:60px;border-radius:50%;display:grid;place-items:center;font-size:26px;flex-shrink:0;position:relative;transition:transform .15s;border:3px solid transparent}
.node .dot .ring{position:absolute;inset:-3px;border-radius:50%;border:3px solid var(--line)}
.node.done .dot{background:linear-gradient(135deg,#34d399,#059669);box-shadow:0 6px 18px rgba(52,211,153,.35)}
.node.current .dot{background:var(--grad);box-shadow:0 0 0 5px rgba(34,211,238,.18),0 8px 22px rgba(34,211,238,.4);animation:pulse 2s infinite}
.node.locked .dot{background:var(--panel);color:var(--dim2)}
.node.project .dot{border-radius:16px;background:linear-gradient(135deg,#fbbf24,#f97316)}
.node.project.locked .dot{background:var(--panel)}
@keyframes pulse{0%,100%{box-shadow:0 0 0 5px rgba(34,211,238,.18),0 8px 22px rgba(34,211,238,.4)}50%{box-shadow:0 0 0 11px rgba(34,211,238,.05),0 8px 22px rgba(34,211,238,.4)}}
.node:active .dot{transform:scale(.94)}
.node .lbl{flex:1;min-width:0}
.node .lbl .t{font-weight:700;font-size:14.5px}
.node .lbl .d{font-size:11.5px;color:var(--dim2);margin-top:2px}
.node.locked .lbl{opacity:.6}
.node .badgexp{font-size:11px;font-weight:800;color:var(--amber);white-space:nowrap}
.connector{position:absolute;left:33px;top:64px;width:3px;height:26px;background:var(--line);border-radius:2px}
.node.done .connector{background:linear-gradient(var(--green),var(--line))}

/* ============ BUTTONS ============ */
.btn{display:block;width:100%;padding:15px;border-radius:15px;font-weight:800;font-size:16px;text-align:center;transition:transform .12s,filter .2s;box-shadow:0 6px 0 rgba(0,0,0,.25)}
.btn:active{transform:translateY(3px);box-shadow:0 3px 0 rgba(0,0,0,.25)}
.btn.primary{background:var(--grad);color:#04121f}
.btn.amber{background:var(--gradA);color:#2b1600}
.btn.green{background:linear-gradient(135deg,#34d399,#059669);color:#052e1d}
.btn.ghost{background:var(--panel);border:1px solid var(--line);color:var(--ink);box-shadow:none}
.btn.red{background:linear-gradient(135deg,#fb7185,#e11d48);color:#2b0410}
.btn:disabled{opacity:.4;pointer-events:none}
.btn.sm{padding:11px;font-size:14px}

/* ============ LESSON ============ */
.lessonhead{display:flex;align-items:center;gap:12px;margin-bottom:14px}
.lessonhead .x{width:36px;height:36px;border-radius:11px;background:var(--panel);border:1px solid var(--line);display:grid;place-items:center;font-size:18px;flex-shrink:0}
.pbar{flex:1;height:14px;border-radius:999px;background:rgba(0,0,0,.35);overflow:hidden}
.pbar i{display:block;height:100%;background:var(--grad);border-radius:999px;transition:width .4s}
.hearts{font-size:14px;font-weight:800;color:var(--red)}
.qcard{animation:slidein .3s ease}
@keyframes slidein{from{opacity:0;transform:translateX(20px)}to{opacity:1;transform:none}}
.qtag{display:inline-block;font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.6px;color:var(--cyan);background:rgba(34,211,238,.1);padding:4px 10px;border-radius:999px;margin-bottom:12px}
.qtag.eth{color:var(--amber);background:rgba(251,191,36,.12)}
.qtext{font-size:19px;font-weight:800;line-height:1.35;margin-bottom:8px}
.qsub{font-size:13.5px;color:var(--dim);line-height:1.5;margin-bottom:16px;background:var(--panel);border-left:3px solid var(--cyan);padding:10px 12px;border-radius:8px;white-space:pre-wrap}
.opts{display:flex;flex-direction:column;gap:10px}
.opt{text-align:left;padding:14px 15px;border-radius:14px;background:var(--panel);border:2px solid var(--line);font-size:15px;font-weight:600;line-height:1.35;transition:all .12s;display:flex;align-items:center;gap:11px}
.opt .k{width:26px;height:26px;border-radius:8px;background:var(--panel2);display:grid;place-items:center;font-size:13px;font-weight:800;flex-shrink:0;color:var(--dim)}
.opt:active{transform:scale(.98)}
.opt.sel{border-color:var(--cyan);background:var(--panel2)}
.opt.correct{border-color:var(--green);background:rgba(52,211,153,.14)} .opt.correct .k{background:var(--green);color:#052e1d}
.opt.wrong{border-color:var(--red);background:rgba(251,113,133,.12)} .opt.wrong .k{background:var(--red);color:#2b0410}
.opt.disabled{pointer-events:none}
.opt.dim{opacity:.45}

/* order exercise */
.orderzone{min-height:56px;background:rgba(0,0,0,.28);border:2px dashed var(--line);border-radius:14px;padding:10px;display:flex;flex-direction:column;gap:8px;margin-bottom:14px}
.orderzone:empty::after{content:"Toca las piezas en orden ↓";color:var(--dim2);font-size:13px;font-weight:600;margin:auto}
.chip{padding:12px 14px;border-radius:12px;background:var(--panel);border:2px solid var(--line);font-size:14.5px;font-weight:600;line-height:1.3;text-align:left;display:flex;gap:9px;align-items:center}
.chip .n{width:22px;height:22px;border-radius:7px;background:var(--cyan);color:#04121f;display:grid;place-items:center;font-size:12px;font-weight:800;flex-shrink:0}
.chip.bank{border-style:solid}
.chip.correct{border-color:var(--green);background:rgba(52,211,153,.14)}
.chip.wrong{border-color:var(--red);background:rgba(251,113,133,.12)}

/* match exercise */
.matchrow{display:flex;gap:10px;align-items:center;margin-bottom:11px}
.matchrow .concept{flex:1;padding:13px;border-radius:12px;background:var(--panel2);border:1px solid var(--line);font-size:14px;font-weight:700}
.matchrow select{flex:1;padding:13px;border-radius:12px;background:var(--panel);border:2px solid var(--line);color:var(--ink);font-size:14px;font-weight:600;font-family:inherit}
.matchrow select.correct{border-color:var(--green)} .matchrow select.wrong{border-color:var(--red)}

/* mission card */
.mission{background:linear-gradient(135deg,#1a2c63,#0c1738);border:1px solid var(--line);border-radius:16px;padding:18px;box-shadow:var(--sh)}
.mission .mtag{display:inline-block;font-size:11px;font-weight:800;letter-spacing:.6px;color:var(--amber);background:rgba(251,191,36,.13);padding:5px 11px;border-radius:999px;margin-bottom:12px}
.mission h4{font-size:19px;font-weight:800;margin-bottom:6px}
.mission .intro{font-size:13.5px;color:var(--dim);line-height:1.5;margin-bottom:14px}
.steps{display:flex;flex-direction:column;gap:10px;margin-bottom:16px}
.step{display:flex;gap:11px;align-items:flex-start;font-size:14px;line-height:1.45}
.step .sn{width:25px;height:25px;border-radius:8px;background:var(--gradA);color:#2b1600;display:grid;place-items:center;font-weight:800;font-size:13px;flex-shrink:0}
.step b{color:var(--cyan)}
.copybox{background:#050b1c;border:1px solid var(--line);border-radius:10px;padding:12px;font-size:13px;line-height:1.5;color:#cfe0ff;margin:6px 0 4px;font-family:ui-monospace,Menlo,Consolas,monospace;white-space:pre-wrap;position:relative}
.copybtn{font-size:11px;font-weight:800;color:var(--cyan);margin-top:6px;padding:6px 10px;background:rgba(34,211,238,.1);border-radius:8px;display:inline-block}

/* feedback bar */
.fb{position:fixed;left:0;right:0;bottom:0;z-index:40;padding:16px;max-width:560px;margin:0 auto;transform:translateY(120%);transition:transform .32s cubic-bezier(.2,.9,.3,1)}
.fb.show{transform:none}
.fb .box{border-radius:16px;padding:15px 16px;box-shadow:0 -8px 30px rgba(0,0,0,.4)}
.fb.good .box{background:linear-gradient(135deg,#0f5132,#065f46);border:1px solid var(--green)}
.fb.bad .box{background:linear-gradient(135deg,#4c1d24,#7f1d1d);border:1px solid var(--red)}
.fb .ft{font-size:16px;font-weight:800;display:flex;align-items:center;gap:8px;margin-bottom:4px}
.fb.good .ft{color:#a7f3d0} .fb.bad .ft{color:#fecaca}
.fb .fx{font-size:13.5px;line-height:1.45;color:#e8fff4}
.fb.bad .fx{color:#ffe4e6}
.fb .btn{margin-top:12px}

/* ============ PROFILE ============ */
.sectitle{font-size:13px;font-weight:800;letter-spacing:.5px;text-transform:uppercase;color:var(--dim2);margin:20px 2px 10px}
.statgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.statbox{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px}
.statbox .v{font-size:26px;font-weight:800;background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
.statbox .l{font-size:12px;color:var(--dim);margin-top:2px}
.badges{display:grid;grid-template-columns:repeat(auto-fill,minmax(88px,1fr));gap:10px}
.badge{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px 6px;text-align:center;transition:transform .2s}
.badge .ic{font-size:30px;filter:grayscale(1);opacity:.32;transition:.3s}
.badge.on .ic{filter:none;opacity:1;animation:pop .5s}
.badge .bn{font-size:10.5px;font-weight:700;margin-top:5px;color:var(--dim)}
.badge.on .bn{color:var(--ink)}
@keyframes pop{0%{transform:scale(.4)}60%{transform:scale(1.25)}100%{transform:scale(1)}}
.skill{margin-bottom:12px}
.skill .sh{display:flex;justify-content:space-between;font-size:13px;font-weight:700;margin-bottom:5px}
.skill .sh .pct{color:var(--dim)}
.skbar{height:10px;border-radius:999px;background:rgba(0,0,0,.35);overflow:hidden}
.skbar i{display:block;height:100%;border-radius:999px;transition:width .8s}

/* ============ SESSION ============ */
.timerwrap{text-align:center;margin:12px 0 18px}
.timerbig{font-size:64px;font-weight:800;font-variant-numeric:tabular-nums;letter-spacing:1px;background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent;line-height:1}
.timerbig.rest{background:var(--gradA);-webkit-background-clip:text}
.timerlbl{font-size:14px;color:var(--dim);margin-top:6px;font-weight:700}
.blocklist{display:flex;flex-direction:column;gap:9px}
.blk{display:flex;gap:12px;align-items:center;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:13px 14px}
.blk.active{border-color:var(--cyan);background:var(--panel2);box-shadow:0 0 0 3px rgba(34,211,238,.12)}
.blk.done{opacity:.55}
.blk .bnum{width:34px;height:34px;border-radius:10px;background:var(--panel2);display:grid;place-items:center;font-weight:800;color:var(--cyan);flex-shrink:0}
.blk.done .bnum{background:var(--green);color:#052e1d}
.blk .bt{flex:1;font-size:14px;font-weight:700}
.blk .bt small{display:block;font-weight:500;color:var(--dim2);font-size:11.5px;margin-top:2px}

/* ============ NAV ============ */
.nav{position:fixed;bottom:0;left:0;right:0;max-width:560px;margin:0 auto;background:rgba(9,16,38,.94);backdrop-filter:blur(10px);border-top:1px solid var(--line);display:flex;padding:6px 6px 8px;z-index:35}
.navbtn{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 2px;border-radius:12px;color:var(--dim2);font-size:10px;font-weight:700;transition:.15s}
.navbtn .ni{font-size:21px}
.navbtn.active{color:var(--cyan)}
.navbtn.active .ni{transform:translateY(-1px)}

/* ============ MODALS ============ */
.overlay{position:fixed;inset:0;z-index:60;background:rgba(3,7,18,.72);backdrop-filter:blur(4px);display:none;align-items:center;justify-content:center;padding:20px}
.overlay.show{display:flex;animation:fade .25s}
.modal{background:linear-gradient(135deg,#16265a,#0c1738);border:1px solid var(--line);border-radius:20px;padding:22px;max-width:400px;width:100%;box-shadow:var(--sh);animation:pop .35s}
.modal h3{font-size:19px;font-weight:800;margin-bottom:8px}
.modal p{font-size:13.5px;color:var(--dim);line-height:1.5;margin-bottom:16px}
.pininput{width:100%;padding:15px;border-radius:14px;background:#050b1c;border:2px solid var(--line);color:var(--ink);font-size:24px;text-align:center;letter-spacing:12px;font-weight:800;margin-bottom:14px}
.pininput:focus{outline:none;border-color:var(--cyan)}
.field{width:100%;padding:12px;border-radius:12px;background:#050b1c;border:2px solid var(--line);color:var(--ink);font-size:14px;margin-bottom:10px;font-family:inherit}

/* ============ CELEBRATION ============ */
#confetti{position:fixed;inset:0;z-index:70;pointer-events:none;display:none}
.celebrate{position:fixed;inset:0;z-index:71;display:none;align-items:center;justify-content:center;flex-direction:column;padding:24px;text-align:center;pointer-events:none}
.celebrate.show{display:flex;animation:fade .3s}
.celebrate .big{font-size:74px;animation:celebpop .6s cubic-bezier(.2,1.4,.4,1)}
@keyframes celebpop{0%{transform:scale(0) rotate(-30deg)}70%{transform:scale(1.2) rotate(8deg)}100%{transform:scale(1) rotate(0)}}
.celebrate .ct{font-size:26px;font-weight:800;margin-top:10px;background:var(--gradA);-webkit-background-clip:text;background-clip:text;color:transparent}
.celebrate .cm{font-size:16px;font-weight:700;color:var(--ink);margin-top:12px;max-width:440px;line-height:1.4}
.celebrate .cx{font-size:15px;font-weight:800;color:var(--amber);margin-top:14px;background:rgba(251,191,36,.14);padding:8px 18px;border-radius:999px}

/* tutor */
.tutrow{display:flex;justify-content:space-between;align-items:center;padding:12px 14px;background:var(--panel);border:1px solid var(--line);border-radius:12px;margin-bottom:8px;gap:10px}
.tutrow .ti{font-size:13.5px;font-weight:700} .tutrow .ti small{display:block;color:var(--dim2);font-weight:500;font-size:11.5px}
.tutrow .tb{font-size:12px;font-weight:800;padding:8px 12px;border-radius:9px;background:var(--panel2);color:var(--cyan);white-space:nowrap}
.tutrow .tb.done{background:var(--green);color:#052e1d}
.pill{display:inline-block;font-size:11px;font-weight:800;padding:3px 9px;border-radius:999px;background:rgba(34,211,238,.12);color:var(--cyan);margin:2px}
.toast{position:fixed;bottom:100px;left:50%;transform:translateX(-50%) translateY(30px);background:var(--panel2);border:1px solid var(--cyan);color:var(--ink);padding:12px 18px;border-radius:12px;font-size:13.5px;font-weight:700;z-index:80;opacity:0;transition:.3s;pointer-events:none;box-shadow:var(--sh)}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.muted{color:var(--dim2);font-size:12px}
.hidden{display:none!important}
</style>
</head>
<body>
<canvas id="confetti"></canvas>
<div class="celebrate" id="celebrate">
  <div class="big" id="celebIcon">🎉</div>
  <div class="ct" id="celebTitle"></div>
  <div class="cm" id="celebMsg"></div>
  <div class="cx" id="celebXp"></div>
</div>

<div class="app">
  <div class="topbar">
    <div class="brand"><span class="logo">✈️</span><span>Academia Piloto IA</span></div>
    <div class="spacer"></div>
    <div class="stat streak" id="streakStat">🔥 0</div>
    <div class="stat xp" id="xpStat">⭐ 0</div>
    <button class="iconbtn" id="soundBtn" title="Sonido">🔊</button>
  </div>

  <!-- CAMINO -->
  <section class="screen active" id="scr-path"></section>
  <!-- LECCIÓN -->
  <section class="screen" id="scr-lesson"></section>
  <!-- PERFIL -->
  <section class="screen" id="scr-profile"></section>
  <!-- SESIÓN -->
  <section class="screen" id="scr-session"></section>
  <!-- TUTOR -->
  <section class="screen" id="scr-tutor"></section>

  <nav class="nav">
    <button class="navbtn active" data-nav="path"><span class="ni">🗺️</span>Camino</button>
    <button class="navbtn" data-nav="session"><span class="ni">⏱️</span>Sesión</button>
    <button class="navbtn" data-nav="profile"><span class="ni">🎖️</span>Perfil</button>
    <button class="navbtn" data-nav="tutor"><span class="ni">🔐</span>Tutor</button>
  </nav>
</div>

<div class="fb" id="feedback"></div>
<div class="overlay" id="overlay"><div class="modal" id="modal"></div></div>
<div class="toast" id="toast"></div>

<script>
/* =====================================================================
   ACADEMIA PILOTO IA  —  app de una sola página, vanilla JS
   Estructura:  CURRICULUM (contenido)  +  ENGINE (lógica de juego)

  {id:"n4",name:"Radar",tag:"Investigar y verificar como un pro",ic:"📡",skill:"verificar",
   lessons:[
    {id:"n4l1",t:"No creas de una",d:"El radar siempre encendido",ex:[

      {type:"detect",skill:"verificar",q:"Detecta el dato sospechoso:",
       sub:"'El avión más rápido del mundo puede volar de Medellín a Tokio en 4 minutos.'",

      {type:"mc",skill:"verificar",q:"¿Cuál es una fuente MÁS confiable para datos de un pez?",
       opts:["Un comentario random en un video","La página de una universidad o entidad ambiental","Un meme","Lo primero que salga"],
       a:1,ex:"Universidades y entidades oficiales son fuentes serias. No todo lo de internet vale igual: elige bien."},
      {type:"mc",skill:"etica",eth:true,q:"Antes de creer que algo grave es cierto, un piloto responsable…",

    {id:"n4l2",t:"Detectar lo inventado",d:"Cazando datos falsos",ex:[
      {type:"detect",skill:"verificar",q:"Detecta la señal de alucinación:",

      {type:"fill",skill:"verificar",q:"Completa: 'Si no puedo comprobar un dato en ningún lado, mejor ______ de él.'",

    {id:"n4l3",t:"Pedir y citar fuentes",d:"Muéstrame de dónde lo sacaste",ex:[

  return DEFAULT_STATE();

/* ---------- fechas (America/Bogota) ---------- */
function todayBogota(){ return new Date().toLocaleDateString('en-CA',{timeZone:'America/Bogota'}); }
function prevDay(iso){ const d=new Date(iso+'T12:00:00'); d.setDate(d.getDate()-1); return d.toLocaleDateString('en-CA'); }

/* ---------- rango / xp ---------- */
function rankFor(xp){ let r=CURRICULUM.ranks[0]; for(const x of CURRICULUM.ranks){ if(xp>=x.xp) r=x; } return r; }
function nextRank(xp){ for(const x of CURRICULUM.ranks){ if(xp<x.xp) return x; } return null; }
function addXP(n){
  const before = rankFor(S.xp).n;
  S.xp += n;
  const after = rankFor(S.xp).n;
  return before!==after ? after : null;
}

/* ---------- desbloqueos ---------- */
function levelUnlocked(i){ if(i===0) return true; const p=CURRICULUM.levels[i-1].project.id; return !!S.projects[p]; }
function lessonUnlocked(i,j){ if(!levelUnlocked(i)) return false; if(j===0) return true; return !!S.done[CURRICULUM.levels[i].lessons[j-1].id]; }
function projectUnlocked(i){ if(!levelUnlocked(i)) return false; return CURRICULUM.levels[i].lessons.every(l=>S.done[l.id]); }
function levelDoneCount(i){ return CURRICULUM.levels[i].lessons.filter(l=>S.done[l.id]).length; }

/* ---------- racha ---------- */
function bumpStreak(){
  const t=todayBogota();
  if(S.lastDay===t) return;
  if(S.lastDay===prevDay(t)) S.streak++; else S.streak=1;
  S.lastDay=t;
  if(S.streak>S.bestStreak) S.bestStreak=S.streak;
  if(S.streak>=7) grantBadge('racha7');
}

  if(S.badges[id]) return false;

}

/* ---------- AUDIO (Web Audio API) ---------- */
let AC=null;
function ac(){ if(!AC){ try{ AC=new (window.AudioContext||window.webkitAudioContext)(); }catch(e){} } return AC; }
function beep(freqs, dur=0.12, type='sine', gain=0.14){
  if(S.muted) return; const c=ac(); if(!c) return;
  if(c.state==='suspended') c.resume();
  let t=c.currentTime;
  freqs.forEach((f,i)=>{
    const o=c.createOscillator(), g=c.createGain();
    o.type=type; o.frequency.value=f;
    g.gain.setValueAtTime(0,t); g.gain.linearRampToValueAtTime(gain,t+0.01);
    g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
    o.connect(g); g.connect(c.destination); o.start(t); o.stop(t+dur); t+=dur*0.9;
  });
}

/* ---------- CONFETTI ---------- */
const cvs=document.getElementById('confetti'); const ctx=cvs.getContext('2d');
let parts=[], confAnim=null;
function sizeCanvas(){ cvs.width=innerWidth; cvs.height=innerHeight; }
addEventListener('resize',sizeCanvas); sizeCanvas();
function burst(n=140){
  sizeCanvas(); cvs.style.display='block';
  const colors=['#22d3ee','#fbbf24','#34d399','#3b82f6','#f97316','#ffffff','#22c55e'];
  for(let i=0;i<n;i++){
    parts.push({x:innerWidth/2+(Math.random()-.5)*140, y:innerHeight*0.38,
      vx:(Math.random()-.5)*11, vy:Math.random()*-13-4, g:0.32+Math.random()*0.2,
      s:6+Math.random()*7, r:Math.random()*6, vr:(Math.random()-.5)*0.5,
      c:colors[(Math.random()*colors.length)|0], life:70+Math.random()*40});
  }
  if(!confAnim) confAnim=requestAnimationFrame(stepConf);
}
function stepConf(){
  ctx.clearRect(0,0,cvs.width,cvs.height);
  parts.forEach(p=>{ p.vy+=p.g; p.x+=p.vx; p.y+=p.vy; p.r+=p.vr; p.life--;
    ctx.save(); ctx.translate(p.x,p.y); ctx.rotate(p.r);
    ctx.fillStyle=p.c; ctx.fillRect(-p.s/2,-p.s/2,p.s,p.s*0.6); ctx.restore(); });
  parts=parts.filter(p=>p.life>0 && p.y<innerHeight+40);
  if(parts.length){ confAnim=requestAnimationFrame(stepConf); }
  else { confAnim=null; ctx.clearRect(0,0,cvs.width,cvs.height); cvs.style.display='none'; }
}

/* =========================================================

let CUR=null;
function startLesson(i,j){
  const ls=CURRICULUM.levels[i].lessons[j];
  CUR={li:i,lj:j,exs:ls.ex.map((e,ei)=>({e,ei})),idx:0,mistakes:0,isReview:false,lessonId:ls.id};
  renderExercise(); show('lesson');
}

function startReview(){
  if(!S.review.length){ toast('Radar limpio: sin errores pendientes ✈️'); return; }
  const exs=S.review.map(ref=>({e:CURRICULUM.levels[ref.li].lessons[ref.lj].ex[ref.ei],ei:ref.ei,ref})).filter(x=>x.e);
  CUR={li:-1,lj:-1,exs,idx:0,mistakes:0,isReview:true};
  renderExercise(); show('lesson');
}

let SEL=null, ORDER=null, MATCH=null, answered=false;
function renderExercise(){
  answered=false; SEL=null; ORDER=null; MATCH=null;
  hideFeedback();
  const total=CUR.exs.length, cur=CUR.idx;
  const {e}=CUR.exs[cur];
  const pct=Math.round((cur/total)*100);
  let head=`<div class="lessonhead">
    <button class="x" onclick="APP.quitLesson()">✕</button>
    <div class="pbar"><i style="width:${pct}%"></i></div>
    <div class="hearts">${CUR.isReview?'🛩️':'❤ '+Math.max(0,3-CUR.mistakes)}</div></div>`;
  let body='';
  const tag = e.eth ? `<span class="qtag eth">🛡️ Seguridad y ética</span>` : `<span class="qtag">${tagName(e.type)}</span>`;
  if(e.type==='order'){
    body=`<div class="qcard">${tag}<div class="qtext">${e.q}</div>
      <div class="orderzone" id="orderzone"></div><div class="opts" id="bank"></div>
      <button class="btn primary" id="checkBtn" style="margin-top:16px" disabled onclick="APP.check()">Comprobar</button></div>`;
  } else if(e.type==='match'){
    body=`<div class="qcard">${tag}<div class="qtext">${e.q}</div><div id="matchbox" style="margin:6px 0 4px"></div>
      <button class="btn primary" id="checkBtn" style="margin-top:12px" disabled onclick="APP.check()">Comprobar</button></div>`;
  } else {
    // choice-like: mc, improve, fill, detect, tf
    const opts = e.type==='tf' ? ['Verdadero','Falso'] : e.opts;
    const sub = e.sub ? `<div class="qsub">${e.sub}</div>` : '';
    let o=opts.map((op,k)=>`<button class="opt" data-k="${k}" onclick="APP.pick(${k})">
        <span class="k">${e.type==='tf'?(k===0?'V':'F'):String.fromCharCode(65+k)}</span><span>${op}</span></button>`).join('');
    body=`<div class="qcard">${tag}<div class="qtext">${e.q}</div>${sub}<div class="opts">${o}</div>
      <button class="btn primary" id="checkBtn" style="margin-top:16px" disabled onclick="APP.check()">Comprobar</button></div>`;
  }
  document.getElementById('scr-lesson').innerHTML=head+body;
  if(e.type==='order') buildOrder(e);
  if(e.type==='match') buildMatch(e);
}
function tagName(t){ return ({mc:'Opción múltiple',improve:'Mejora el prompt',fill:'Completa',tf:'Verdadero o falso',detect:'Detecta el error',order:'Ordena las piezas',match:'Empareja'})[t]||'Ejercicio'; }

/* ----- choice ----- */
function pick(k){
  if(answered) return;
  SEL=k;
  document.querySelectorAll('#scr-lesson .opt').forEach(o=>o.classList.toggle('sel', +o.dataset.k===k));
  document.getElementById('checkBtn').disabled=false;
}
/* ----- order ----- */
function buildOrder(e){
  ORDER={chosen:[], bank:e.items.map((t,idx)=>({t,idx})).sort(()=>Math.random()-0.5)};
  paintOrder(e);
}
function paintOrder(e){
  const z=document.getElementById('orderzone'), b=document.getElementById('bank');
  z.innerHTML=ORDER.chosen.map((c,pos)=>`<button class="chip" onclick="APP.orderBack(${pos})"><span class="n">${pos+1}</span>${c.t}</button>`).join('');
  b.innerHTML=ORDER.bank.map((c,pos)=>`<button class="chip bank" onclick="APP.orderPick(${pos})">${c.t}</button>`).join('');
  document.getElementById('checkBtn').disabled = ORDER.bank.length!==0;
}
function orderPick(pos){ if(answered)return; ORDER.chosen.push(ORDER.bank[pos]); ORDER.bank.splice(pos,1); paintOrder(CUR.exs[CUR.idx].e); }
function orderBack(pos){ if(answered)return; ORDER.bank.push(ORDER.chosen[pos]); ORDER.chosen.splice(pos,1); paintOrder(CUR.exs[CUR.idx].e); }
/* ----- match ----- */
function buildMatch(e){
  MATCH={}; const opts=e.pairs.map(p=>p.r).sort(()=>Math.random()-0.5);
  const box=document.getElementById('matchbox');
  box.innerHTML=e.pairs.map((p,idx)=>`<div class="matchrow"><div class="concept">${p.l}</div>
    <select data-idx="${idx}" onchange="APP.matchSel(${idx},this.value)">
      <option value="">— elige —</option>${opts.map(o=>`<option value="${encodeURIComponent(o)}">${o}</option>`).join('')}</select></div>`).join('');
}
function matchSel(idx,val){ if(answered)return; MATCH[idx]=decodeURIComponent(val);
  const e=CUR.exs[CUR.idx].e; document.getElementById('checkBtn').disabled = Object.keys(MATCH).filter(k=>MATCH[k]).length!==e.pairs.length; }

/* ----- comprobar ----- */
function check(){
  if(answered && !document.getElementById('checkBtn')) return;
  const {e,ei}=CUR.exs[CUR.idx];
  let correct=false, detail='';
  if(e.type==='order'){
    correct=ORDER.chosen.every((c,pos)=>c.idx===pos);
    document.querySelectorAll('#orderzone .chip').forEach((el,pos)=>el.classList.add(ORDER.chosen[pos].idx===pos?'correct':'wrong'));
  } else if(e.type==='match'){
    correct=e.pairs.every((p,idx)=>MATCH[idx]===p.r);
    document.querySelectorAll('#matchbox select').forEach((sel,idx)=>sel.classList.add(MATCH[idx]===e.pairs[idx].r?'correct':'wrong'));
  } else {
    const ans = e.type==='tf' ? (e.a?0:1) : e.a;
    correct = SEL===ans;
    document.querySelectorAll('#scr-lesson .opt').forEach(o=>{
      const k=+o.dataset.k; o.classList.add('disabled');
      if(k===ans) o.classList.add('correct');
      else if(k===SEL) o.classList.add('wrong');
      else o.classList.add('dim');
    });
  }
  // stats (solo primer intento)
  if(!answered){
    if(!CUR.isReview){
      const sk=e.skill||'general';
      S.skill[sk]=S.skill[sk]||{ok:0,total:0}; S.skill[sk].total++;
      S.exCount++;
      if(correct){ S.skill[sk].ok++; S.correctCount++; }
    }
    if(correct){
      if(e.eth) S.ethCount++;
      if(e.type==='improve') grantBadge('promptCerto');
    } else {
      // a repaso
      if(!CUR.isReview){ const ref={li:CUR.li,lj:CUR.lj,ei}; if(!S.review.some(r=>r.li===ref.li&&r.lj===ref.lj&&r.ei===ref.ei)) S.review.push(ref); }
    }
    save();
  }
  answered=true;
  document.getElementById('checkBtn').style.display='none';
  if(correct){
    sndGood();
    if(CUR.isReview && CUR.exs[CUR.idx].ref){ const rf=CUR.exs[CUR.idx].ref; S.review=S.review.filter(r=>!(r.li===rf.li&&r.lj===rf.lj&&r.ei===rf.ei)); save(); }
    showFeedback(true, e.ok||"¡Correcto!", e.ex||e.why||"", ()=>advance());
  } else {
    sndBad(); CUR.mistakes++;
    showFeedback(false, "Casi. Vuelve a intentarlo", e.ex||e.why||"Revisa bien las opciones.", ()=>retry());
  }
  checkStandingBadges();
}
function retry(){ renderExercise(); }
function advance(){
  hideFeedback();
  CUR.idx++;
  if(CUR.idx<CUR.exs.length){ renderExercise(); }
  else finishLesson();
}
function finishLesson(){
  if(CUR.isReview){
    const gain=8; addXP(gain); bumpStreak(); save(); refreshTop();
    celebrate({icon:"🛩️",title:"¡Simulación superada!",msg:"Repasaste tus errores como un piloto que corrige el rumbo. Radar afinado.",xp:"+"+gain+" XP"});
    setTimeout(()=>{ renderPath(); show('path'); },900); return;
  }
  const ls=CURRICULUM.levels[CUR.li].lessons[CUR.lj];
  const first=!S.done[ls.id];
  const gain = CUR.mistakes===0 ? 15 : 12;
  if(first){ S.done[ls.id]=true; S.lessonsCount++; }
  const rankUp=addXP(first?gain:5);
  bumpStreak();
  if(S.lessonsCount>=1) grantBadge('primerVuelo');
  checkStandingBadges();
  save(); refreshTop();
  celebrate({icon:"✅",title:"¡Lección completada!",msg:randomCeleb(),xp:"+"+(first?gain:5)+" XP"});
  setTimeout(()=>{
    if(rankUp) celebrate({icon:"🎖️",title:"¡Ascenso de rango!",msg:"Ahora eres "+rankUp+". La torre de control te felicita, Daniel.",xp:""});
  }, 2600);
  setTimeout(()=>{ renderPath(); show('path'); }, rankUp?3000:1100);
}
function quitLesson(){ renderPath(); show('path'); }

    </div>
    <div style="display:flex;gap:10px;margin-bottom:8px">
      <button class="btn ${TM.run?'ghost':'primary'} sm" style="flex:1" onclick="APP.tmToggle()">${TM.run?'⏸ Pausar':'▶ Iniciar'}</button>
      <button class="btn ghost sm" style="flex:1" onclick="APP.tmNext()">⏭ Siguiente</button>
      <button class="btn ghost sm" style="flex:1" onclick="APP.tmReset()">↺ Reiniciar</button>
    </div>
    <div class="blocklist">`;
  BLOCKS.forEach((b,i)=>{ const cls=i<TM.block?'done':i===TM.block?'active':'';
    h+=`<div class="blk ${cls}"><div class="bnum">${i<TM.block?'✓':i+1}</div>
      <div class="bt">${b.t}<small>${b.d}</small></div></div>`; });
  h+=`</div><div class="capi" style="margin-top:16px"><div class="face">🦜</div>
    <div class="bub">Tip de Capi: cada bloque son <b>25 minutos</b> de foco y luego <b>5 de descanso</b>. Si te distraes, respira y vuelve. ¡El foco se entrena como el saque! 🎾</div></div>`;
  document.getElementById('scr-session').innerHTML=h;
}
function fmt(s){ const m=(s/60|0),ss=s%60; return String(m).padStart(2,'0')+':'+String(ss).padStart(2,'0'); }
function tmTick(){
  TM.sec--;
  const d=document.getElementById('tmDisp'); if(d) d.textContent=fmt(TM.sec);
  if(TM.sec<=0){
    sndAlert();
    if(!TM.rest){ TM.rest=true; TM.sec=5*60; toast('⏰ ¡Fin del bloque! Descanso de 5 min'); }
    else { TM.rest=false; TM.block=Math.min(TM.block+1,BLOCKS.length-1); TM.sec=25*60; toast('☕ Fin del descanso · Bloque '+(TM.block+1)); }
    if(TM.block>=BLOCKS.length-1 && !TM.rest && TM.sec===25*60){}
    renderSession();
  }
}
function tmToggle(){ TM.run=!TM.run; if(TM.run){ ac(); TM.iv=setInterval(tmTick,1000);} else clearInterval(TM.iv); renderSession(); }
function tmNext(){ clearInterval(TM.iv); TM.run=false; TM.rest=false; TM.block=Math.min(TM.block+1,BLOCKS.length-1); TM.sec=25*60; renderSession(); }
function tmReset(){ clearInterval(TM.iv); TM={run:false,rest:false,sec:25*60,block:0,iv:null}; renderSession(); }

/* =========================================================
   PANTALLA 5 · MODO TUTOR (PIN 2412)
   ========================================================= */
const elOv=document.getElementById('overlay'), elModal=document.getElementById('modal');
function openTutor(){
  if(tutorAuthed){ renderTutor(); show('tutor'); return; }
  elModal.innerHTML=`<h3>🔐 Modo Tutor</h3><p>Panel privado de Felipe. Ingresa el PIN de 4 dígitos.</p>
    <input class="pininput" id="pinIn" type="password" inputmode="numeric" maxlength="4" placeholder="••••">
    <button class="btn primary" onclick="APP.checkPin()">Entrar</button>
    <button class="btn ghost sm" style="margin-top:8px" onclick="APP.closeOverlay()">Cancelar</button>`;
  elOv.classList.add('show'); setTimeout(()=>{const p=document.getElementById('pinIn'); if(p)p.focus();},100);
}
function checkPin(){ const v=document.getElementById('pinIn').value;
  if(v===PIN){ tutorAuthed=true; closeOverlay(); renderTutor(); show('tutor'); }
  else { toast('PIN incorrecto'); document.getElementById('pinIn').value=''; } }
function closeOverlay(){ elOv.classList.remove('show'); }

function renderTutor(){
  const r=rankFor(S.xp);
  let h=`<div class="sectitle">Panel del tutor · Progreso de Daniel</div>
    <div class="statgrid">
      <div class="statbox"><div class="v">${S.xp}</div><div class="l">XP · ${r.n}</div></div>
      <div class="statbox"><div class="v">${S.lessonsCount}</div><div class="l">Lecciones hechas</div></div>
      <div class="statbox"><div class="v">${S.streak}🔥</div><div class="l">Racha (mejor ${S.bestStreak})</div></div>
      <div class="statbox"><div class="v">${S.exCount?Math.round(S.correctCount/S.exCount*100):0}%</div><div class="l">Aciertos</div></div>
    </div>`;
  // dominio por tema
  h+=`<div class="sectitle">Dominio por tema</div>`;
  let any=false;
  Object.keys(SKILL_NAMES).forEach(sk=>{ const d=S.skill[sk]; if(!d||!d.total) return; any=true;
    const pct=Math.round(d.ok/d.total*100);
    const col=pct>=80?'#34d399':pct>=50?'#fbbf24':'#fb7185';
    h+=`<div class="skill"><div class="sh"><span>${SKILL_NAMES[sk]}</span><span class="pct">${pct}%</span></div>
      <div class="skbar"><i style="width:${pct}%;background:${col}"></i></div></div>`; });
  if(!any) h+=`<div class="muted">Aún sin datos.</div>`;
  // validar proyectos/misiones
  h+=`<div class="sectitle">Validar proyectos (misiones reales)</div>`;
  CURRICULUM.levels.forEach((lv,i)=>{ const p=lv.project, st=S.projects[p.id];
    let btn;
    if(st==='validated') btn=`<span class="tb done">Validado 🏅</span>`;
    else if(st==='pending') btn=`<button class="tb" onclick="APP.validate(${i})">Validar +insignia</button>`;
    else btn=`<span class="tb" style="opacity:.5">Sin entregar</span>`;
    h+=`<div class="tutrow"><div class="ti">${lv.name}<small>${p.title.replace(/Proyecto.*?: /,'')}</small></div>${btn}</div>`; });
  // XP bonus
  h+=`<div class="sectitle">Otorgar XP bonus</div>
    <div style="display:flex;gap:8px;flex-wrap:wrap">
      <button class="btn amber sm" style="flex:1" onclick="APP.bonus(10)">+10</button>
      <button class="btn amber sm" style="flex:1" onclick="APP.bonus(25)">+25</button>
      <button class="btn amber sm" style="flex:1" onclick="APP.bonus(50)">+50</button></div>`;
  // datos
  h+=`<div class="sectitle">Respaldo y datos</div>
    <button class="btn ghost sm" style="margin-bottom:8px" onclick="APP.exportData()">⬇️ Exportar progreso (JSON)</button>
    <button class="btn ghost sm" style="margin-bottom:8px" onclick="document.getElementById('importFile').click()">⬆️ Importar progreso (JSON)</button>
    <input type="file" id="importFile" accept="application/json,.json" class="hidden" onchange="APP.importData(event)">
    <button class="btn red sm" style="margin-bottom:8px" onclick="APP.resetData()">🗑️ Resetear todo el progreso</button>
    <button class="btn ghost sm" onclick="APP.lockTutor()">🔒 Salir del modo tutor</button>
    <div class="muted" style="margin-top:14px;text-align:center">Academia Piloto IA · datos guardados en este dispositivo</div>`;
  document.getElementById('scr-tutor').innerHTML=h;
}
function validate(i){ const p=CURRICULUM.levels[i].project; S.projects[p.id]='validated';
  const map={n3p:'promptMaster',n4p:'detective',n5p:'artista',n6p:'emprendedor',n7p:'programador'};
  if(map[p.id]) grantBadge(map[p.id]); save(); toast('Proyecto validado ✓'); renderTutor(); }
function bonus(n){ const up=addXP(n); checkStandingBadges(); save(); refreshTop(); toast('+'+n+' XP otorgados');
  if(up) celebrate({icon:'🎖️',title:'¡Ascenso!',msg:'Daniel ahora es '+up+'.',xp:''}); renderTutor(); }
function exportData(){ const blob=new Blob([JSON.stringify(S,null,2)],{type:'application/json'});
  const a=document.createElement('a'); a.href=URL.createObjectURL(blob);
  a.download='academia-piloto-daniel-'+todayBogota()+'.json'; a.click(); setTimeout(()=>URL.revokeObjectURL(a.href),1000); toast('Progreso exportado ✓'); }
function importData(ev){ const f=ev.target.files[0]; if(!f) return; const rd=new FileReader();
  rd.onload=()=>{ try{ const d=JSON.parse(rd.result); S=Object.assign(DEFAULT_STATE(),d); save(); refreshTop(); renderTutor(); renderPath(); toast('Progreso importado ✓'); }
    catch(e){ toast('Archivo inválido'); } }; rd.readAsText(f); ev.target.value=''; }
function resetData(){ elModal.innerHTML=`<h3>🗑️ Resetear todo</h3><p>Se borrará TODO el progreso de Daniel en este dispositivo. Esta acción no se puede deshacer. ¿Seguro?</p>
    <button class="btn red" onclick="APP.doReset()">Sí, borrar todo</button>
    <button class="btn ghost sm" style="margin-top:8px" onclick="APP.closeOverlay()">Cancelar</button>`; elOv.classList.add('show'); }
function doReset(){ S=DEFAULT_STATE(); save(); closeOverlay(); refreshTop(); renderTutor(); renderPath(); toast('Progreso reseteado'); }
function lockTutor(){ tutorAuthed=false; renderPath(); show('path'); }

/* =========================================================
   API pública (para onclick)
   ========================================================= */
const APP={
  openLesson:(i,j)=>{ if(!lessonUnlocked(i,j))return; startLesson(i,j); },
  openProject, doProject, copyPrompt, review:startReview,
  pick, check, orderPick, orderBack, matchSel, quitLesson,
  tmToggle, tmNext, tmReset,
  checkPin, closeOverlay, validate, bonus, exportData, importData, resetData, doReset, lockTutor
};
window.APP=APP;

/* ---------- FEEDBACK BAR ---------- */
const elFb=document.getElementById('feedback');
function showFeedback(good, title, ex, onContinue){
  elFb.className='fb '+(good?'good':'bad');
  elFb.innerHTML=`<div class="box"><div class="ft">${good?'✅':'🔁'} ${title}</div>
    <div class="fx">${ex||''}</div>
    <button class="btn ${good?'green':'red'}" id="fbBtn">${good?'Continuar →':'Reintentar'}</button></div>`;
  requestAnimationFrame(()=>elFb.classList.add('show'));
  document.getElementById('fbBtn').onclick=()=>{ onContinue&&onContinue(); };
}
function hideFeedback(){ elFb.classList.remove('show'); }

/* ---------- ARRANQUE ---------- */
renderPath();
refreshTop();
show('path');
console.log('%c✈️ Academia Piloto IA lista','color:#22d3ee;font-weight:bold');
</script>
