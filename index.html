/* compatibilidad: la pantalla arranca en la etapa que sigue */
let planEtapa=null;
/* La clase que sigue = la primera etapa que el alumno MÁS ADELANTADO no ha
   terminado. Se mira a toda la tripulación (si ya se cargó), no solo al piloto
   que esté abierto, porque la clase avanza al ritmo del grupo. */
function etapaSugerida(){
  const estados=(TRIP&&TRIP.length)?TRIP.map(r=>r.st).filter(Boolean):[S];
  const hecha=id=>estados.some(st=>(st.done||{})[id]);
  for(const lv of CURRICULUM.levels){ for(const le of lv.lessons){ if(!hecha(le.id)) return lv.id; } }
  return CURRICULUM.levels[CURRICULUM.levels.length-1].id;
}
/* Andrés puede FIJAR la etapa de la clase (queda guardada), porque la clase suele ir
   por delante del avance del juego. Si no fija nada, se usa la sugerida automática. */
function planActual(){ const id=planEtapa||CFG.claseFijada||etapaSugerida(); return PLANES[id]?id:CURRICULUM.levels[0].id; }
function fijarClase(){ CFG.claseFijada=planActual(); saveConfig(); planEtapa=null; renderSession(); toast("📌 Fijada como la clase de hoy"); }
function soltarClase(){ CFG.claseFijada=""; saveConfig(); planEtapa=null; renderSession(); toast("Vuelve a seguir el avance del juego"); }
function BLOCKS_DE(id){ return (PLANES[id]||PLANES.e1).blocks; }
let TM={run:false,rest:false,sec:25*60,block:0,iv:null};
function renderSession(){
  const id=planActual(); const P=PLANES[id]; const BL=P.blocks; const b=BL[TM.block]||BL[0];
  const lv=CURRICULUM.levels.find(l=>l.id===id); const idx=CURRICULUM.levels.findIndex(l=>l.id===id);
  const sug=etapaSugerida(); const fijada=CFG.claseFijada||"";
  const esLaQueSigue=(id===sug); const estaFijada=(id===fijada);
  // progreso del grupo en esa etapa (para saber si ya la vieron)
  const hechas=lv?lv.lessons.filter(le=>S.done[le.id]).length:0;
  let h=`<div class="sectitle">🎖️ Plan de clase · solo para Andrés</div>
  <div class="capi" style="margin-bottom:12px"><div class="face">${CAPI_SVG}</div><div class="bub"><b>Cómo usar el juego en clase:</b> jueguen la etapa nueva <b>juntos, una vez</b> (proyectada, ~10 min) para encender el tema; luego tú enseñas y el <b>proyecto real</b> lo fija. Repetir el juego = tarea o descanso. Nunca todos en pantallas separadas.</div></div>`;
  // selector de etapa
  h+=`<div class="planpick">
    <button class="planarrow" ${idx<=0?'disabled':''} onclick="APP.planPrev()">◀</button>
    <div class="planmid"><div class="planet">Etapa ${lv?lv.etapa:'?'} · ${esc(lv?lv.name:'')}</div>
      <div class="plantema">${esc(P.tema)}</div>
      <div class="planchip ${estaFijada?'now':esLaQueSigue?'now':''}">${estaFijada?'📌 Clase de hoy':esLaQueSigue?'▶ Va según el avance del juego':(hechas>0?`Ya vista (${hechas}/${lv.lessons.length} lecciones)`:'Más adelante')}</div></div>
    <button class="planarrow" ${idx>=CURRICULUM.levels.length-1?'disabled':''} onclick="APP.planNext()">▶</button></div>`;
  h+=`<div style="display:flex;gap:8px;margin-bottom:12px">`;
  if(!estaFijada) h+=`<button class="btn amber sm" style="flex:1" onclick="APP.fijarClase()">📌 Fijar como la clase de hoy</button>`;
  else h+=`<button class="btn ghost sm" style="flex:1" onclick="APP.soltarClase()">📌 Quitar fijado (seguir el juego)</button>`;
  if(planEtapa) h+=`<button class="btn ghost sm" style="flex:1" onclick="APP.planAuto()">↩︎ Volver</button>`;
  h+=`</div>`;
  h+=`<div class="muted" style="margin:-4px 0 12px;line-height:1.5">La clase suele ir por delante del juego. Muévete con ◀ ▶ y <b>fija</b> la etapa que vas a dar: queda guardada y el plan se abre siempre en esa.</div>`;
  h+=`<div class="timerwrap"><div class="timerbig ${TM.rest?'rest':''}" id="tmDisp">${fmt(TM.sec)}</div><div class="timerlbl">${TM.rest?'☕ Descanso · 5 min':('Bloque '+(TM.block+1)+' · '+b.t)}</div></div>
  <div style="display:flex;gap:10px;margin-bottom:14px"><button class="btn ${TM.run?'ghost':'primary'} sm" style="flex:1" onclick="APP.tmToggle()">${TM.run?'⏸ Pausar':'▶ Iniciar'}</button><button class="btn ghost sm" style="flex:1" onclick="APP.tmNext()">⏭ Siguiente</button><button class="btn ghost sm" style="flex:1" onclick="APP.tmReset()">↺ Reiniciar</button></div>
  <div class="sectitle">Sesión de 3 horas · 6 bloques de 25 min</div><div class="blocklist">`;
  BL.forEach((bl,i)=>{ const cls=i<TM.block?'done':i===TM.block?'active':'';
    h+=`<div class="blk ${cls}" style="flex-direction:column;align-items:stretch;gap:0">
      <div style="display:flex;gap:12px;align-items:center"><div class="bnum">${i<TM.block?'✓':i+1}</div><div class="bt">${bl.t}</div></div>
      <div style="font-size:12px;line-height:1.55;margin-top:8px"><span style="color:var(--cyan);font-weight:800">Cómo:</span> <span style="color:var(--dim)">${bl.como}</span><br><span style="color:var(--amber);font-weight:800">Ejemplo:</span> <span style="color:var(--dim)">${bl.ej}</span><br><span style="color:#6ee7b7;font-weight:800">TDAH:</span> <span style="color:var(--dim)">${bl.tdah}</span></div></div>`; });
  h+=`</div><div class="muted" style="text-align:center;margin-top:12px">Descansos de 5 min tras el bloque 2 (min 55) y tras el bloque 4 (min 1h55).</div>
  <button class="btn ghost sm" style="margin-top:12px" onclick="APP.volverComandante()">← Volver al panel del Comandante</button>`;
  document.getElementById('scr-session').innerHTML=h; }
function planPrev(){ const i=CURRICULUM.levels.findIndex(l=>l.id===planActual()); if(i>0){ planEtapa=CURRICULUM.levels[i-1].id; tmReset(); } }
function planNext(){ const i=CURRICULUM.levels.findIndex(l=>l.id===planActual()); if(i<CURRICULUM.levels.length-1){ planEtapa=CURRICULUM.levels[i+1].id; tmReset(); } }
function planAuto(){ planEtapa=null; tmReset(); }
function abrirSesion(){ if(!tutorAuthed){ openTutor(); return; } renderSession(); show('session'); }
function volverComandante(){ renderTutor(); show('tutor'); }
function fmt(s){ const m=(s/60|0),ss=s%60; return String(m).padStart(2,'0')+':'+String(ss).padStart(2,'0'); }
function tmTick(){ TM.sec--; const d=document.getElementById('tmDisp'); if(d)d.textContent=fmt(TM.sec);
  if(TM.sec<=0){ if(!TM.rest){ sndBell(); TM.rest=true; TM.sec=5*60; toast('🔔 ¡25 minutos! Fin del bloque · descanso de 5 min'); } else { sndAlert(); TM.rest=false; TM.block=Math.min(TM.block+1,BLOCKS.length-1); TM.sec=25*60; toast('☕ Fin del descanso · Bloque '+(TM.block+1)); } renderSession(); } }
function tmToggle(){ TM.run=!TM.run; if(TM.run){ ac(); TM.iv=setInterval(tmTick,1000);} else clearInterval(TM.iv); renderSession(); }
function tmNext(){ clearInterval(TM.iv); TM.run=false; TM.rest=false; TM.block=Math.min(TM.block+1,BLOCKS.length-1); TM.sec=25*60; renderSession(); }
function tmReset(){ clearInterval(TM.iv); TM={run:false,rest:false,sec:25*60,block:0,iv:null}; renderSession(); }

  elModal.innerHTML=`<h3>🎖️ Modo Comandante</h3><p>Panel de Andrés (quien instruye a los futuros capitanes). Ingresa el PIN de 4 dígitos.</p>

function checkPin(){ if(document.getElementById('pinIn').value===PIN){ tutorAuthed=true; closeOverlay(); renderTutor(); show('tutor'); cargarTripulacion(); } else { toast('PIN incorrecto'); document.getElementById('pinIn').value=''; } }
function closeOverlay(){ elOv.classList.remove('show'); }
/* --- Tablero de toda la tripulación (se lee de la nube) --- */
let TRIP=null, tripCargando=false;
function cargarTripulacion(){ tripCargando=true; renderTutor();
  return pullRoster().then(()=>Promise.all(PROFILES.map(p=>
      bestStateFor(p).then(st=>({p,st:st||null})))))
    .then(rs=>{ TRIP=rs; tripCargando=false; renderTutor(); })
    .catch(()=>{ tripCargando=false; TRIP=[]; renderTutor(); }); }
function haceCuanto(t){ if(!t) return "nunca";
  const d=Math.floor((Date.now()-t)/86400000);
  if(d<=0) return "hoy"; if(d===1) return "ayer"; if(d<7) return "hace "+d+" días";
  if(d<30) return "hace "+Math.floor(d/7)+" sem."; return "hace "+Math.floor(d/30)+" meses"; }
function etapaActual(st){ if(!st) return "sin empezar";
  for(const lv of CURRICULUM.levels){ for(const le of lv.lessons){ if(!(st.done||{})[le.id]) return "Etapa "+lv.etapa+" · "+lv.name; } }
  return "¡Terminó todo!"; }
function tablaTripulacion(){
  if(tripCargando) return `<div class="muted" style="padding:10px 2px">☁️ Cargando el progreso de todos…</div>`;
  if(!TRIP||!TRIP.length) return `<div class="muted" style="padding:10px 2px">Aún no hay pilotos registrados.</div>`;
  const orden=TRIP.slice().sort((a,b)=>((b.st&&b.st.xp)||0)-((a.st&&a.st.xp)||0));
  let h="";
  orden.forEach((row,pos)=>{
    const p=row.p, st=row.st||{}; const r=rankFor(st.xp||0);
    const ins=CURRICULUM.levels.filter(l=>(st.moduleDone||{})[l.id]).length;
    const acc=st.exCount?Math.round(st.correctCount/st.exCount*100):0;
    const medalla=pos===0?'🥇':pos===1?'🥈':pos===2?'🥉':'　';
    const colAcc=acc>=80?'var(--green)':acc>=50?'var(--amber)':'var(--red)';
    // temas flojos
    const flojos=Object.keys(SKILL_NAMES).map(sk=>{const d=(st.skill||{})[sk]; if(!d||d.total<3)return null;
        return {n:SKILL_NAMES[sk],pct:Math.round(d.ok/d.total*100)};}).filter(Boolean)
      .filter(x=>x.pct<70).sort((a,b)=>a.pct-b.pct).slice(0,3);
    // preguntas falladas
    const fails=Object.values(st.fails||{}).sort((a,b)=>(b.n||0)-(a.n||0)).slice(0,3);
    h+=`<div class="crewcard">
      <div class="crewtop"><div class="crewav">${p.avatar||'✈️'}</div>
        <div class="crewid"><div class="crewnm">${medalla} ${esc(p.name)} ${p.callsign?`<small>«${esc(p.callsign)}»</small>`:''}</div>
          <div class="crewsub">${r.ic} ${r.n} · ${etapaActual(st)}</div>
          <div class="crewsub2">Última vez: ${haceCuanto(st._t||p.visto)}</div></div>
        <div class="crewxp">${st.xp||0}<small>XP</small></div></div>
      <div class="crewstats">
        <div><b>${st.lessonsCount||0}</b><span>lecciones</span></div>
        <div><b>${ins}/${CURRICULUM.levels.length}</b><span>insignias</span></div>
        <div><b style="color:${colAcc}">${acc}%</b><span>aciertos</span></div>
        <div><b>🔥 ${st.streak||0}</b><span>racha</span></div></div>`;
    if(flojos.length){ h+=`<div class="crewweak"><b>⚠️ Le cuesta:</b> ${flojos.map(f=>`${esc(f.n)} <i>(${f.pct}%)</i>`).join(' · ')}</div>`; }
    if(fails.length){ h+=`<div class="crewfail"><b>❌ Preguntas que falló:</b><ul>${fails.map(f=>`<li>Etapa ${f.et} · ${esc(f.lec||'')}: “${esc(f.q||'')}”${(f.n||1)>1?` <i>(${f.n} veces)</i>`:''}</li>`).join('')}</ul></div>`; }
    if(!flojos.length && !fails.length && (st.exCount||0)>0) h+=`<div class="crewweak" style="color:var(--green);border-color:rgba(52,211,153,.3)"><b>✅ Sin puntos flojos por ahora.</b></div>`;
    h+=`</div>`;
  });
  return h;
}

  Object.keys(SKILL_NAMES).forEach(sk=>{ const d=S.skill[sk]; if(!d||!d.total)return; any=true; const pct=Math.round(d.ok/d.total*100); const col=pct>=80?'#34d399':pct>=50?'#fbbf24':'#fb7185';

  if(!any) h+=`<div class="muted">Aún sin datos: ${pilotName()} apenas empieza.</div>`;
  h+=`<div class="sectitle">Premios y cartas (los defines tú)</div>`;
  if(!CFG.dadLetter||!CFG.familyNote) h+=`<div style="background:rgba(251,191,36,.12);border:1px solid rgba(251,191,36,.4);border-radius:12px;padding:11px 13px;margin-bottom:10px;font-size:12.5px;line-height:1.5;color:var(--amber)"><b>⭐ Antes de mostrarle el juego a Daniel:</b> escribe abajo la <b>Carta del papá</b> y el <b>Mensaje de la familia</b>. Eso es lo que le pone alma al premio y hace que sienta que el simulador real es de verdad suyo.</div>`;
  h+=`<div class="muted" style="margin-bottom:8px">Estos premios reales tú los prometes y cumples. Aparecen en el juego para motivar.</div>
    <div class="flabel">🎁 Premio al llegar a Alférez (220 XP)</div><input class="field" id="rwA" value="${(CFG.rewards.Alférez||'').replace(/"/g,'&quot;')}" placeholder="Ej: una salida de pesca">
    <div class="flabel">🎁 Premio al llegar a Teniente (520 XP)</div><input class="field" id="rwT" value="${(CFG.rewards.Teniente||'').replace(/"/g,'&quot;')}" placeholder="Ej: el nuevo FIFA">
    <div class="flabel">🎁 Premio al llegar a Primer Oficial (780 XP)</div><input class="field" id="rwP" value="${(CFG.rewards['Primer Oficial']||'').replace(/"/g,'&quot;')}" placeholder="Ej: ir a un partido de Nacional">
    <div class="flabel">✍️ Carta del papá (aparece en el premio grande)</div><input class="field" id="dadL" value="${(CFG.dadLetter||'').replace(/"/g,'&quot;')}" placeholder="Ej: Yo, Andrés, te llevo a volar de verdad cuando seas Capitán.">
    <div class="flabel">💛 Mensaje de la familia (aparece en el Camino)</div><input class="field" id="famN" value="${(CFG.familyNote||'').replace(/"/g,'&quot;')}" placeholder="Ej: ¡Vamos Dani, tú puedes!">
    <button class="btn amber sm" onclick="APP.saveCfg()">Guardar premios y mensajes</button>`;
  h+=`<div class="sectitle">Nube y respaldo</div>
    <div style="background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:11px 13px;margin-bottom:10px;text-align:center">
      <div class="muted" style="margin-bottom:4px">🔑 Código de piloto de ${esc(pilotName())} (para recuperar su progreso en otro equipo):</div>
      <div style="font-size:22px;font-weight:800;letter-spacing:4px;color:var(--cyan)">${activeId||'—'}</div></div>
    <div id="cloudStat" class="muted" style="text-align:center;margin-bottom:10px">${cloudOk===null?'☁️ Conectando…':cloudOk?'☁️ Sincronizado con la nube':'☁️ Guardado en este equipo'}</div>
    <button class="btn ghost sm" style="margin-bottom:8px" onclick="APP.syncNow()">🔄 Sincronizar ahora</button>
    <button class="btn ghost sm" style="margin-bottom:8px" onclick="APP.exportData()">⬇️ Exportar progreso (JSON)</button>
    <button class="btn ghost sm" style="margin-bottom:8px" onclick="document.getElementById('importFile').click()">⬆️ Importar progreso</button>
    <input type="file" id="importFile" accept="application/json,.json" class="hidden" onchange="APP.importData(event)">
    <button class="btn red sm" style="margin-bottom:8px" onclick="APP.resetData()">🗑️ Resetear el progreso de ${pilotName()}</button>
    <button class="btn ghost sm" onclick="APP.lockTutor()">🔒 Salir del modo Comandante</button>
    <div class="muted" style="margin-top:14px;text-align:center;line-height:1.5">🛡️ Nota para papás: Capi solo dice frases pregrabadas del juego; NO es una IA en vivo chateando con tu hijo. Las misiones piden usar la IA con supervisión.</div>`;
  document.getElementById('scr-tutor').innerHTML=h;
}
function saveCfg(){ CFG.rewards.Alférez=document.getElementById('rwA').value.trim(); CFG.rewards.Teniente=document.getElementById('rwT').value.trim(); CFG.rewards['Primer Oficial']=document.getElementById('rwP').value.trim();
  CFG.dadLetter=document.getElementById('dadL').value.trim(); CFG.familyNote=document.getElementById('famN').value.trim(); saveConfig(); toast('Guardado ✓'); }
function bonus(){}
function exportData(){ const blob=new Blob([JSON.stringify(S,null,2)],{type:'application/json'}); const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download='capitan-'+pilotName()+'-'+todayBogota()+'.json'; a.click(); setTimeout(()=>URL.revokeObjectURL(a.href),1000); toast('Exportado ✓'); }
function importData(ev){ const f=ev.target.files[0]; if(!f)return; const rd=new FileReader(); rd.onload=()=>{ try{ const d=JSON.parse(rd.result); S=Object.assign(DEFAULT_STATE(),d); save(); refreshTop(); renderTutor(); renderPath(); toast('Importado ✓'); }catch(e){ toast('Archivo inválido'); } }; rd.readAsText(f); ev.target.value=''; }
function resetData(){ elModal.innerHTML=`<h3>🗑️ Resetear</h3><p>Se borrará el progreso de <b>${pilotName()}</b> en este equipo. ¿Seguro?</p><button class="btn red" onclick="APP.doReset()">Sí, borrar</button><button class="btn ghost sm" style="margin-top:8px" onclick="APP.closeOverlay()">Cancelar</button>`; elOv.classList.add('show'); }
function doReset(){ S=DEFAULT_STATE(); S.createdAt=Date.now(); save(); closeOverlay(); refreshTop(); renderTutor(); renderPath(); toast('Reseteado'); }
function lockTutor(){ tutorAuthed=false; renderPath(); show('path'); }
function syncNow(){ toast('Sincronizando…'); flushCloud(); cloudReady=false; cloudLoad(()=>{ renderTutor(); renderPath(); }); }
function switchPilot(){ flushCloud(); showProfiles(); }

/* ---------- API pública ---------- */
const APP={ openLesson:(i,j)=>startLesson(i,j), review:startReview, choosePractice, startPractice, pick, check, orderPick, orderBack, matchSel, quitLesson, doMission, copyPrompt,
  tmToggle, tmNext, tmReset, checkPin, closeOverlay, exportData, importData, resetData, doReset, lockTutor, syncNow, saveCfg, switchPilot, cargarTripulacion,
  planPrev, planNext, planAuto, abrirSesion, volverComandante, fijarClase, soltarClase,
  newPilot, pickAva, pickCs, createPilot, pickPilot, delPilot, doDelPilot, recoverPilot, doRecover, editPilot, saveEdit };
window.APP=APP;

/* ---------- ARRANQUE ---------- */
function boot(){
  try{ if(LOGO_URI&&LOGO_URI.indexOf('data:')===0){ document.getElementById('favicon').href=LOGO_URI; } }catch(e){}
  const entrarAlPiloto=()=>{
    S=loadState(); if(!S.createdAt){S.createdAt=Date.now();} syncMeta(); saveLocal();
    refreshTop(); renderPath(); show('path'); hideProfiles(); cloudLoad(()=>{ syncMeta(); renderPath(); });
  };
  // Siempre se pregunta a la nube por la tripulación: así los pilotos aparecen
  // en cualquier equipo aunque este celular haya perdido sus datos.
  if(activeId && PROFILES.find(p=>p.id===activeId)){
    entrarAlPiloto(); pullRoster();
  } else {
    buscandoPilotos=PROFILES.length===0; showProfiles();
    pullRoster().then(()=>{ buscandoPilotos=false;
      if(activeId && PROFILES.find(p=>p.id===activeId)) entrarAlPiloto(); else renderProfiles(); })
      .catch(()=>{ buscandoPilotos=false; renderProfiles(); });
  }
}
boot();
console.log('%c✈️ Tripulación Vélez EchandIA lista · Prieto IA Empresarial','color:#22d3ee;font-weight:bold');

</script>
