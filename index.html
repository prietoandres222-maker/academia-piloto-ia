<!DOCTYPE html>
<html lang="es-CO">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#070d20">
<title>Tripulación Vélez EchandIA</title>
<link rel="icon" id="favicon" href="">
<!-- App en el celular (pantalla de inicio, sin barras del navegador) -->
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="manifest" href="/manifest.webmanifest">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="EchandIA">
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{
  --night:#070d20;--night2:#0c1738;--panel:#111f45;--panel2:#16265a;
  --line:rgba(120,160,255,.16);--cyan:#22d3ee;--cyan2:#0ea5c4;--amber:#fbbf24;--amber2:#f59e0b;
  --green:#34d399;--greenD:#0f5132;--red:#fb7185;--redD:#4c1d24;
  --ink:#eaf1ff;--dim:#9fb2d8;--dim2:#6b7ba8;
  --grad:linear-gradient(135deg,#22d3ee,#3b82f6);--gradA:linear-gradient(135deg,#fbbf24,#f97316);
  --gradG:linear-gradient(135deg,#34d399,#059669);--r:18px;--sh:0 10px 30px rgba(0,0,0,.35);
}
html,body{height:100%}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  background:radial-gradient(1200px 700px at 80% -10%,#13245c 0%,transparent 60%),radial-gradient(900px 600px at 0% 10%,#0b2340 0%,transparent 55%),var(--night);
  color:var(--ink);-webkit-font-smoothing:antialiased;overflow-x:hidden}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
.app{width:100%;max-width:100%;margin:0 auto;min-height:100vh;position:relative;padding-bottom:92px;display:none}
.app.on{display:block}

/* ===== TOP BAR ===== */
/* padding-top con env(safe-area-inset-top): en el iPhone baja el contenido para que
   NO se meta debajo del reloj, la batería ni el notch cuando se abre como app. */
.topbar{position:sticky;top:0;z-index:30;background:linear-gradient(180deg,rgba(7,13,32,.97),rgba(7,13,32,.78));
  backdrop-filter:blur(8px);padding:calc(10px + env(safe-area-inset-top)) 14px 10px;
  display:flex;align-items:center;gap:10px;border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:8px;font-weight:800;font-size:14px;letter-spacing:.2px}
.brand .logo{width:30px;height:30px;border-radius:9px;background:var(--grad);display:grid;place-items:center;font-size:16px;box-shadow:0 4px 14px rgba(34,211,238,.4)}
.brand b{background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
.brand .bname{color:#fff;font-weight:800}
.brand .ia,.pbrand .ia{color:#3b82f6;font-weight:900;text-shadow:0 0 12px rgba(59,130,246,.5)}
.pbrand h1{color:#fff}
.brandlogo{height:66px;width:auto;object-fit:contain;margin:0 auto 6px;display:block;filter:drop-shadow(0 4px 14px rgba(0,0,0,.4))}
.madeby{margin-top:22px;text-align:center;font-size:11.5px;color:var(--dim2);line-height:1.6}
.madeby img{height:26px;vertical-align:middle;margin-right:6px;opacity:.9}
.madeby a{color:var(--cyan);text-decoration:none;font-weight:700}
.spacer{flex:1}
.stat{display:flex;align-items:center;gap:5px;font-weight:800;font-size:13px;padding:6px 9px;border-radius:999px;background:var(--panel);border:1px solid var(--line)}
.stat.xp{color:var(--amber)}.stat.streak{color:#ff9d5c}
.iconbtn{width:36px;height:36px;border-radius:11px;background:var(--panel);border:1px solid var(--line);display:grid;place-items:center;font-size:16px}
.miniava{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;font-size:19px;border:2px solid var(--cyan);background:var(--panel2);cursor:pointer}

/* ===== SCREENS ===== */
.screen{display:none;padding:16px;animation:fade .3s ease}
.screen.active{display:block}
@keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.wrap{width:100%;max-width:620px;margin:0 auto}

/* ===== HERO PREMIO (V1) ===== */
.prizehero{position:relative;border-radius:20px;overflow:hidden;border:1px solid var(--line);box-shadow:var(--sh);margin-bottom:16px;background:linear-gradient(160deg,#0a1b3e,#0a1230)}
.prizehero .sky{position:relative;height:132px;overflow:hidden}
.prizehero .plabel{position:absolute;top:10px;left:12px;right:12px;z-index:2}
.prizehero .ptag{font-size:10.5px;font-weight:800;letter-spacing:.6px;color:var(--amber);background:rgba(251,191,36,.16);display:inline-block;padding:3px 9px;border-radius:999px}
.prizehero .pt{font-size:15px;font-weight:800;color:#fff;margin-top:5px;line-height:1.2;text-shadow:0 2px 8px rgba(0,0,0,.6)}
.prizehero .pbody{padding:12px 14px 14px}
.prizehero .pdesc{font-size:12.5px;color:var(--dim);line-height:1.45}
.prizehero .pdesc b{color:var(--cyan)}
.runway{margin-top:11px;position:relative;height:34px;border-radius:10px;background:linear-gradient(90deg,#0a1024,#0e1a3a);border:1px solid var(--line);overflow:hidden}
.runway .rline{position:absolute;top:50%;left:8px;right:34px;height:0;border-top:2px dashed rgba(255,255,255,.25)}
.runway .rplane{position:absolute;top:50%;transform:translate(-50%,-50%);font-size:20px;transition:left 1.1s cubic-bezier(.3,.9,.3,1);filter:drop-shadow(0 3px 5px rgba(34,211,238,.5))}
.runway .rgoal{position:absolute;right:6px;top:50%;transform:translateY(-50%);font-size:18px}
.runway .rv1{position:absolute;right:34px;top:2px;font-size:8.5px;font-weight:800;color:var(--amber)}
.prizehero .pprog{font-size:11px;color:var(--dim2);margin-top:6px;text-align:center}
.prizehero .pprog b{color:var(--amber)}

/* ===== RANK CARD ===== */
.rankcard{background:linear-gradient(135deg,#16265a,#0c1738);border:1px solid var(--line);border-radius:var(--r);padding:14px;display:flex;align-items:center;gap:13px;box-shadow:var(--sh);position:relative;overflow:hidden;margin-bottom:12px}
.rankcard::after{content:"";position:absolute;right:-30px;top:-30px;width:130px;height:130px;background:radial-gradient(circle,rgba(34,211,238,.22),transparent 70%)}
.avatar{width:56px;height:56px;border-radius:16px;background:var(--gradA);display:grid;place-items:center;font-size:30px;flex-shrink:0;box-shadow:0 6px 18px rgba(245,158,11,.35)}
.rankinfo{flex:1;min-width:0}
.rankinfo .who{font-size:12.5px;color:var(--dim)}
.rankinfo .who b{color:var(--cyan)}
.rankinfo .rank{font-size:18px;font-weight:800;line-height:1.1}
.rankinfo .rank b{background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
.progbar{height:9px;border-radius:999px;background:rgba(0,0,0,.35);margin-top:8px;overflow:hidden}
.progbar i{display:block;height:100%;background:var(--gradA);border-radius:999px;transition:width .8s cubic-bezier(.2,.9,.3,1)}
.rankinfo .next{font-size:11px;color:var(--dim2);margin-top:4px}

/* ===== CONTINÚA AQUÍ ===== */
.continuecard{display:flex;align-items:center;gap:12px;background:linear-gradient(135deg,#0e7490,#0b5c9c);border:1.5px solid var(--cyan);border-radius:16px;padding:14px 16px;margin:12px 0;cursor:pointer;box-shadow:0 10px 26px rgba(34,211,238,.28);transition:transform .12s}
.continuecard:active{transform:scale(.985)}
.continuecard.done{background:var(--gradG);border-color:var(--green);cursor:default}
.cc-l{flex:1;min-width:0}
.cc-tag{font-size:11px;font-weight:800;letter-spacing:.7px;color:#c8f5ff}
.cc-t{font-size:17px;font-weight:800;color:#fff;line-height:1.15;margin-top:3px}
.cc-s{font-size:12px;color:#d9f4ff;margin-top:2px}
.cc-btn{background:#fff;color:#04121f;font-weight:800;font-size:14px;padding:11px 16px;border-radius:12px;white-space:nowrap;flex-shrink:0}

/* ===== CAPI ===== */
.capi{display:flex;gap:11px;align-items:flex-start;margin:12px 0;background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:11px 13px;box-shadow:var(--sh)}
.capi .face{width:42px;height:42px;flex-shrink:0}
.capi .bub{font-size:13px;line-height:1.45}
.capi .bub b{color:var(--cyan)}

/* ===== ETAPAS / CAMINO ===== */
.leveltitle{display:flex;align-items:center;gap:10px;margin:20px 2px 6px}
.leveltitle .num{width:30px;height:30px;border-radius:9px;background:var(--panel2);border:1px solid var(--line);display:grid;place-items:center;font-weight:800;font-size:15px;color:var(--cyan);flex-shrink:0}
.leveltitle .ltinfo{min-width:0}
.leveltitle h3{font-size:15.5px;font-weight:800}
.leveltitle .sub{font-size:11.5px;color:var(--dim2)}
.leveltitle.moduledone{opacity:.6}
.leveltitle.modulenow .num{box-shadow:0 0 0 3px rgba(34,211,238,.35)}
.mchip{display:inline-block;font-size:10px;font-weight:800;padding:2px 8px;border-radius:999px;background:var(--panel2);color:var(--dim);vertical-align:middle;margin-left:6px}
.mchip.mdone{background:rgba(52,211,153,.2);color:#6ee7b7}
.mchip.mnow{background:var(--cyan);color:#04121f;animation:pulseC 1.8s infinite}
.mchip.msoon{background:transparent;border:1px solid var(--line);color:var(--dim2)}
@keyframes pulseC{0%,100%{box-shadow:0 0 0 0 rgba(34,211,238,.45)}50%{box-shadow:0 0 0 6px rgba(34,211,238,0)}}
.path{position:relative;padding:4px 0}
.node{position:relative;display:flex;align-items:center;gap:14px;padding:7px 4px}
.node .dot{width:56px;height:56px;border-radius:50%;display:grid;place-items:center;font-size:24px;flex-shrink:0;border:3px solid transparent;transition:transform .15s}
.node .dot .ring{position:absolute;inset:-3px;border-radius:50%;border:3px solid var(--line)}
.node.done .dot{background:var(--gradG);box-shadow:0 6px 18px rgba(52,211,153,.35)}
.node.current .dot{background:var(--grad);box-shadow:0 0 0 5px rgba(34,211,238,.18),0 8px 22px rgba(34,211,238,.4);animation:pulse 2s infinite}
.node:not(.done):not(.current) .dot{background:var(--panel)}
@keyframes pulse{0%,100%{box-shadow:0 0 0 5px rgba(34,211,238,.18),0 8px 22px rgba(34,211,238,.4)}50%{box-shadow:0 0 0 11px rgba(34,211,238,.05),0 8px 22px rgba(34,211,238,.4)}}
.node:active .dot{transform:scale(.94)}
.node .lbl{flex:1;min-width:0}
.node .lbl .t{font-weight:700;font-size:14px}
.node .lbl .d{font-size:11.5px;color:var(--dim2);margin-top:2px}
.node .badgexp{font-size:11px;font-weight:800;color:var(--amber);white-space:nowrap}
.connector{position:absolute;left:31px;top:60px;width:3px;height:22px;background:var(--line);border-radius:2px}
.node.done .connector{background:linear-gradient(var(--green),var(--line))}

/* ===== BOTONES ===== */
.btn{display:block;width:100%;padding:15px;border-radius:15px;font-weight:800;font-size:16px;text-align:center;transition:transform .12s,filter .2s;box-shadow:0 6px 0 rgba(0,0,0,.25)}
.btn:active{transform:translateY(3px);box-shadow:0 3px 0 rgba(0,0,0,.25)}
.btn.primary{background:var(--grad);color:#04121f}
.btn.amber{background:var(--gradA);color:#2b1600}
.btn.green{background:var(--gradG);color:#052e1d}
.btn.ghost{background:var(--panel);border:1px solid var(--line);color:var(--ink);box-shadow:none}
.btn.red{background:linear-gradient(135deg,#fb7185,#e11d48);color:#2b0410}
.btn:disabled{opacity:.4;pointer-events:none}
.btn.sm{padding:11px;font-size:14px}

/* ===== LECCIÓN (UX Duolingo) ===== */
#scr-lesson{padding-bottom:110px}
.lessonhead{display:flex;align-items:center;gap:12px;margin-bottom:16px}
.lessonhead .x{width:34px;height:34px;border-radius:11px;background:var(--panel);border:1px solid var(--line);display:grid;place-items:center;font-size:17px;flex-shrink:0}
.pbar{flex:1;height:14px;border-radius:999px;background:rgba(0,0,0,.35);overflow:hidden}
.pbar i{display:block;height:100%;background:var(--gradG);border-radius:999px;transition:width .4s}
.qcard{animation:slidein .3s ease;max-width:620px;margin:0 auto}
@keyframes slidein{from{opacity:0;transform:translateX(18px)}to{opacity:1;transform:none}}
.qtag{display:inline-block;font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.6px;color:var(--cyan);background:rgba(34,211,238,.1);padding:4px 10px;border-radius:999px;margin-bottom:12px}
.qtag.eth{color:var(--amber);background:rgba(251,191,36,.12)}
.qtext{font-size:19px;font-weight:800;line-height:1.3;margin-bottom:8px}
.qsub{font-size:13px;color:var(--dim);line-height:1.5;margin-bottom:14px;background:var(--panel);border-left:3px solid var(--cyan);padding:10px 12px;border-radius:8px;white-space:pre-wrap;user-select:text}
.opts{display:flex;flex-direction:column;gap:10px}
.opt{text-align:left;padding:14px 15px;border-radius:14px;background:var(--panel);border:2px solid var(--line);font-size:15px;font-weight:600;line-height:1.3;transition:all .12s;display:flex;align-items:center;gap:11px}
.opt .k{width:26px;height:26px;border-radius:8px;background:var(--panel2);display:grid;place-items:center;font-size:13px;font-weight:800;flex-shrink:0;color:var(--dim)}
.opt:active{transform:scale(.98)}
.opt.sel{border-color:var(--cyan);background:var(--panel2)}
.opt.correct{border-color:var(--green);background:rgba(52,211,153,.14)}.opt.correct .k{background:var(--green);color:#052e1d}
.opt.wrong{border-color:var(--red);background:rgba(251,113,133,.12)}.opt.wrong .k{background:var(--red);color:#2b0410}
.opt.disabled{pointer-events:none}.opt.dim{opacity:.45}
.orderzone{min-height:52px;background:rgba(0,0,0,.28);border:2px dashed var(--line);border-radius:14px;padding:10px;display:flex;flex-direction:column;gap:8px;margin-bottom:12px}
.orderzone:empty::after{content:"Toca las piezas en orden ↓";color:var(--dim2);font-size:13px;font-weight:600;margin:auto}
.chip{padding:12px 14px;border-radius:12px;background:var(--panel);border:2px solid var(--line);font-size:14px;font-weight:600;line-height:1.3;text-align:left;display:flex;gap:9px;align-items:center}
.chip .n{width:22px;height:22px;border-radius:7px;background:var(--cyan);color:#04121f;display:grid;place-items:center;font-size:12px;font-weight:800;flex-shrink:0}
.chip.correct{border-color:var(--green);background:rgba(52,211,153,.14)}.chip.wrong{border-color:var(--red);background:rgba(251,113,133,.12)}
.matchrow{display:flex;gap:10px;align-items:center;margin-bottom:11px}
.matchrow .concept{flex:1;padding:13px;border-radius:12px;background:var(--panel2);border:1px solid var(--line);font-size:14px;font-weight:700}
.matchrow select{flex:1;padding:13px;border-radius:12px;background:var(--panel);border:2px solid var(--line);color:var(--ink);font-size:14px;font-weight:600;font-family:inherit}
.matchrow select.correct{border-color:var(--green)}.matchrow select.wrong{border-color:var(--red)}
.mission{background:linear-gradient(135deg,#1a2c63,#0c1738);border:1px solid var(--line);border-radius:16px;padding:18px;box-shadow:var(--sh)}
.mission .mtag{display:inline-block;font-size:11px;font-weight:800;letter-spacing:.6px;color:var(--amber);background:rgba(251,191,36,.13);padding:5px 11px;border-radius:999px;margin-bottom:12px}
.mission h4{font-size:18px;font-weight:800;margin-bottom:6px}
.mission .intro{font-size:13px;color:var(--dim);line-height:1.5;margin-bottom:14px}
.steps{display:flex;flex-direction:column;gap:10px;margin-bottom:14px}
.step{display:flex;gap:11px;align-items:flex-start;font-size:13.5px;line-height:1.4}
.step .sn{width:24px;height:24px;border-radius:8px;background:var(--gradA);color:#2b1600;display:grid;place-items:center;font-weight:800;font-size:12px;flex-shrink:0}
.step b{color:var(--cyan)}
.copybox{background:#050b1c;border:1px solid var(--line);border-radius:10px;padding:12px;font-size:13px;line-height:1.5;color:#cfe0ff;margin:6px 0 4px;font-family:ui-monospace,Menlo,Consolas,monospace;white-space:pre-wrap;user-select:text}
.copybtn{font-size:11px;font-weight:800;color:var(--cyan);margin-top:6px;padding:6px 10px;background:rgba(34,211,238,.1);border-radius:8px;display:inline-block}

/* botón COMPROBAR fijo abajo */
.checkbar{position:fixed;left:0;right:0;bottom:0;z-index:38;padding:14px 16px calc(14px + env(safe-area-inset-bottom));max-width:660px;margin:0 auto;transform:translateY(140%);transition:transform .28s cubic-bezier(.2,.9,.3,1);background:linear-gradient(180deg,transparent,var(--night) 30%)}
.checkbar.show{transform:none}
.checkbar .btn{margin:0}
/* feedback */
.fb{position:fixed;left:0;right:0;bottom:0;z-index:40;padding:14px 16px calc(14px + env(safe-area-inset-bottom));max-width:660px;margin:0 auto;transform:translateY(140%);transition:transform .3s cubic-bezier(.2,.9,.3,1)}
.fb.show{transform:none}
.fb .box{border-radius:16px;padding:14px 16px;box-shadow:0 -8px 30px rgba(0,0,0,.4)}
.fb.good .box{background:var(--gradG);border:1px solid var(--green)}
.fb.bad .box{background:linear-gradient(135deg,#4c1d24,#7f1d1d);border:1px solid var(--red)}
.fb .ft{font-size:16px;font-weight:800;display:flex;align-items:center;gap:8px;margin-bottom:4px}
.fb.good .ft{color:#eafff5}.fb.bad .ft{color:#fecaca}
.fb .fx{font-size:13px;line-height:1.45;color:#eafff5}.fb.bad .fx{color:#ffe4e6}
.fb .btn{margin-top:12px}

/* ===== PERFIL / LOGROS ===== */
.sectitle{font-size:13px;font-weight:800;letter-spacing:.5px;text-transform:uppercase;color:var(--dim2);margin:20px 2px 10px}
.statgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px}
.statbox{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px}
.statbox .v{font-size:24px;font-weight:800;background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
.statbox .l{font-size:12px;color:var(--dim);margin-top:2px}
.badges{display:grid;grid-template-columns:repeat(auto-fill,minmax(86px,1fr));gap:10px}
.badge{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px 6px;text-align:center}
.badge .ic{font-size:28px;filter:grayscale(1);opacity:.32;transition:.3s}
.badge.on .ic{filter:none;opacity:1;animation:pop .5s}
.badge .bn{font-size:10px;font-weight:700;margin-top:5px;color:var(--dim)}
.badge.on .bn{color:var(--ink)}
@keyframes pop{0%{transform:scale(.4)}60%{transform:scale(1.25)}100%{transform:scale(1)}}
.skill{margin-bottom:12px}
.skill .sh{display:flex;justify-content:space-between;font-size:13px;font-weight:700;margin-bottom:5px}
.skill .sh .pct{color:var(--dim)}
.skbar{height:10px;border-radius:999px;background:rgba(0,0,0,.35);overflow:hidden}
.skbar i{display:block;height:100%;border-radius:999px;transition:width .8s}

/* ===== RIEL DE INSIGNIAS ===== */
.pathgrid{display:block}
.badgerail{display:none}
.badgestrip{background:linear-gradient(135deg,#16265a,#0c1738);border:1px solid var(--line);border-radius:14px;padding:10px 12px;margin:2px 0 14px}
.bstrip-h{font-size:11px;font-weight:700;color:var(--dim);margin-bottom:8px}
.bstrip-h b{color:var(--cyan)}
.bstrip-track{display:flex;gap:9px;overflow-x:auto;padding-bottom:2px}
.bstrip-item{flex:0 0 auto;width:44px;text-align:center}
.bstrip-ic{width:44px;height:44px;border-radius:12px;background:rgba(0,0,0,.25);display:grid;place-items:center;font-size:22px;filter:grayscale(1);opacity:.35;border:1.5px solid transparent}
.bstrip-item.on .bstrip-ic{filter:none;opacity:1;background:rgba(52,211,153,.14);border-color:rgba(52,211,153,.45)}
.bstrip-item.next .bstrip-ic{filter:none;opacity:.95;border-color:var(--cyan);animation:railpulse 1.8s infinite}
.bstrip-n{font-size:8.5px;font-weight:700;color:var(--dim2);margin-top:3px;line-height:1.1}
.bstrip-item.on .bstrip-n{color:var(--ink)}
@keyframes railpulse{0%,100%{box-shadow:0 0 0 0 rgba(34,211,238,.45)}50%{box-shadow:0 0 0 6px rgba(34,211,238,0)}}

/* ===== SESIÓN / CRONÓMETRO ===== */
.timerwrap{text-align:center;margin:12px 0 18px}
.timerbig{font-size:60px;font-weight:800;font-variant-numeric:tabular-nums;letter-spacing:1px;background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent;line-height:1}
.timerbig.rest{background:var(--gradA);-webkit-background-clip:text}
.timerlbl{font-size:14px;color:var(--dim);margin-top:6px;font-weight:700}
.blocklist{display:flex;flex-direction:column;gap:9px}
.blk{display:flex;gap:12px;align-items:center;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:13px 14px}
.blk.active{border-color:var(--cyan);background:var(--panel2);box-shadow:0 0 0 3px rgba(34,211,238,.12)}
.blk.done{opacity:.55}
.blk .bnum{width:32px;height:32px;border-radius:10px;background:var(--panel2);display:grid;place-items:center;font-weight:800;color:var(--cyan);flex-shrink:0}
.blk.done .bnum{background:var(--green);color:#052e1d}
.blk .bt{flex:1;font-size:14px;font-weight:700}
.blk .bt small{display:block;font-weight:500;color:var(--dim2);font-size:11.5px;margin-top:2px}

/* ===== NAV ===== */
.nav{position:fixed;bottom:0;left:0;right:0;margin:0 auto;background:rgba(9,16,38,.94);backdrop-filter:blur(10px);border-top:1px solid var(--line);display:flex;justify-content:center;gap:6px;padding:6px 6px calc(8px + env(safe-area-inset-bottom));z-index:35}
.navbtn{flex:1;max-width:200px;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 2px;border-radius:12px;color:var(--dim2);font-size:10px;font-weight:700;transition:.15s}
.navbtn .ni{font-size:21px}
.navbtn.active{color:var(--cyan)}

/* ===== MODALES ===== */
.overlay{position:fixed;inset:0;z-index:60;background:rgba(3,7,18,.72);backdrop-filter:blur(4px);display:none;align-items:center;justify-content:center;padding:20px}
.overlay.show{display:flex;animation:fade .25s}
.modal{background:linear-gradient(135deg,#16265a,#0c1738);border:1px solid var(--line);border-radius:20px;padding:22px;max-width:420px;width:100%;box-shadow:var(--sh);animation:pop .35s;max-height:90vh;overflow-y:auto}
.modal h3{font-size:19px;font-weight:800;margin-bottom:8px}
.modal p{font-size:13px;color:var(--dim);line-height:1.5;margin-bottom:14px}
.pininput{width:100%;padding:15px;border-radius:14px;background:#050b1c;border:2px solid var(--line);color:var(--ink);font-size:24px;text-align:center;letter-spacing:12px;font-weight:800;margin-bottom:14px}
.pininput:focus{outline:none;border-color:var(--cyan)}
.field{width:100%;padding:12px;border-radius:12px;background:#050b1c;border:2px solid var(--line);color:var(--ink);font-size:15px;margin-bottom:10px;font-family:inherit}
.field:focus{outline:none;border-color:var(--cyan)}
.flabel{font-size:12px;font-weight:700;color:var(--dim);margin:4px 2px 6px}

/* ===== SELECCIÓN DE PILOTO ===== */
#scr-profiles{display:none;min-height:100vh;padding:calc(26px + env(safe-area-inset-top)) 18px calc(26px + env(safe-area-inset-bottom));align-items:center;justify-content:center;flex-direction:column;animation:fade .3s}
#scr-profiles.on{display:flex}
.pbrand{text-align:center;margin-bottom:6px}
.pbrand .lg{font-size:44px}
.pbrand h1{font-size:24px;font-weight:800;margin-top:4px}
.pbrand h1 b{background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
.pbrand .sl{font-size:12.5px;color:var(--dim);margin-top:4px}
.psub{font-size:13px;color:var(--dim);text-align:center;margin:16px 0 14px;font-weight:700}
.pilotgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:14px;width:100%;max-width:440px}
.pilotcard{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:14px 8px;text-align:center;cursor:pointer;transition:transform .12s,border-color .2s;position:relative}
.pilotcard:active{transform:scale(.96)}
.pilotcard:hover{border-color:var(--cyan)}
.pilotcard .pav{width:60px;height:60px;border-radius:16px;background:var(--panel2);border:2px solid var(--cyan);display:grid;place-items:center;font-size:32px;margin:0 auto 8px}
.pilotcard .pnm{font-size:13px;font-weight:800;line-height:1.15}
.pilotcard .pcs{font-size:10.5px;color:var(--cyan);font-weight:700;margin-top:2px}
.pilotcard.add .pav{background:transparent;border-style:dashed;border-color:var(--line);color:var(--dim2)}
.pilotcard .del,.pilotcard .edt{position:absolute;top:4px;width:22px;height:22px;border-radius:8px;background:rgba(0,0,0,.45);font-size:11px;display:grid;place-items:center;opacity:.7}
.pilotcard .del{right:4px}.pilotcard .edt{left:4px}
.pilotcard .pxp{font-size:10px;font-weight:800;color:var(--amber);margin-top:4px}
.avapick{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px}
.avaopt{width:44px;height:44px;border-radius:12px;background:var(--panel);border:2px solid var(--line);display:grid;place-items:center;font-size:22px;cursor:pointer}
.avaopt.sel{border-color:var(--cyan);background:var(--panel2)}
.csopts{display:flex;flex-wrap:wrap;gap:7px;margin-bottom:12px}
.csopt{font-size:12px;font-weight:700;padding:7px 11px;border-radius:999px;background:var(--panel);border:1px solid var(--line);color:var(--dim);cursor:pointer}
.csopt.sel{border-color:var(--cyan);color:var(--cyan);background:var(--panel2)}

/* ===== PLAN DE CLASE (solo Comandante) ===== */
.planentry{display:flex;align-items:center;gap:12px;background:linear-gradient(135deg,#0e7490,#0b5c9c);border:1.5px solid var(--cyan);border-radius:16px;padding:13px 15px;margin:14px 0 4px;cursor:pointer;box-shadow:0 8px 22px rgba(34,211,238,.25);transition:transform .12s}
.planentry:active{transform:scale(.985)}
.planentry .pe-ic{font-size:26px;flex-shrink:0}
.planentry .pe-txt{flex:1;min-width:0}
.planentry .pe-t{font-size:15px;font-weight:800;color:#fff}
.planentry .pe-s{font-size:11.5px;color:#d9f4ff;margin-top:2px;line-height:1.35}
.planentry .pe-go{background:#fff;color:#04121f;font-weight:800;font-size:12.5px;padding:8px 12px;border-radius:10px;white-space:nowrap;flex-shrink:0}
.planpick{display:flex;align-items:center;gap:10px;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:10px 8px;margin-bottom:12px}
.planarrow{width:38px;height:38px;border-radius:11px;background:var(--panel2);border:1px solid var(--line);color:var(--cyan);font-size:15px;font-weight:800;flex-shrink:0}
.planarrow:disabled{opacity:.25;pointer-events:none}
.planmid{flex:1;min-width:0;text-align:center}
.planet{font-size:14.5px;font-weight:800;line-height:1.15}
.plantema{font-size:11.5px;color:var(--dim);margin-top:2px}
.planchip{display:inline-block;font-size:10px;font-weight:800;padding:3px 9px;border-radius:999px;margin-top:5px;background:var(--panel2);color:var(--dim2)}
.planchip.now{background:var(--cyan);color:#04121f}

/* ===== TABLERO DE TRIPULACIÓN (Comandante) ===== */
.crewcard{background:linear-gradient(135deg,#16265a,#0c1738);border:1px solid var(--line);border-radius:16px;padding:13px 14px;margin-bottom:11px;box-shadow:var(--sh)}
.crewtop{display:flex;align-items:center;gap:11px}
.crewav{width:46px;height:46px;border-radius:13px;background:var(--panel2);border:2px solid var(--cyan);display:grid;place-items:center;font-size:24px;flex-shrink:0}
.crewid{flex:1;min-width:0}
.crewnm{font-size:15px;font-weight:800;line-height:1.15}
.crewnm small{color:var(--cyan);font-weight:700;font-size:11.5px}
.crewsub{font-size:11.5px;color:var(--dim);margin-top:2px}
.crewsub2{font-size:10.5px;color:var(--dim2);margin-top:1px}
.crewxp{font-size:24px;font-weight:800;color:var(--amber);line-height:1;text-align:right;flex-shrink:0}
.crewxp small{display:block;font-size:9.5px;color:var(--dim2);font-weight:700}
.crewstats{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:11px;padding-top:10px;border-top:1px solid var(--line)}
.crewstats>div{text-align:center}
.crewstats b{display:block;font-size:15px;font-weight:800}
.crewstats span{font-size:9.5px;color:var(--dim2);font-weight:700}
.crewweak{margin-top:10px;font-size:11.5px;line-height:1.5;color:var(--amber);background:rgba(251,191,36,.1);border:1px solid rgba(251,191,36,.28);border-radius:10px;padding:8px 10px}
.crewweak i{color:var(--dim);font-style:normal}
.crewfail{margin-top:8px;font-size:11.5px;line-height:1.5;color:var(--dim);background:rgba(251,113,133,.09);border:1px solid rgba(251,113,133,.25);border-radius:10px;padding:8px 10px}
.crewfail b{color:var(--red)}
.crewfail ul{margin:5px 0 0 15px;padding:0}
.crewfail li{margin-bottom:3px}
.crewfail i{color:var(--dim2);font-style:normal}

.muted{color:var(--dim2);font-size:12px}
.hidden{display:none!important}
.tutrow{display:flex;justify-content:space-between;align-items:center;padding:12px 14px;background:var(--panel);border:1px solid var(--line);border-radius:12px;margin-bottom:8px;gap:10px}
.tutrow .ti{font-size:13px;font-weight:700}.tutrow .ti small{display:block;color:var(--dim2);font-weight:500;font-size:11.5px}
.tutrow .tb{font-size:12px;font-weight:800;padding:8px 12px;border-radius:9px;background:var(--panel2);color:var(--cyan);white-space:nowrap}
.tutrow .tb.done{background:var(--green);color:#052e1d}
.toast{position:fixed;bottom:100px;left:50%;transform:translateX(-50%) translateY(30px);background:var(--panel2);border:1px solid var(--cyan);color:var(--ink);padding:12px 18px;border-radius:12px;font-size:13px;font-weight:700;z-index:80;opacity:0;transition:.3s;pointer-events:none;box-shadow:var(--sh);max-width:90%;text-align:center}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

/* ===== CONFETTI + CELEBRACIÓN ===== */
#confetti{position:fixed;inset:0;z-index:70;pointer-events:none;display:none}
.celebrate{position:fixed;inset:0;z-index:71;display:none;align-items:center;justify-content:center;flex-direction:column;padding:24px;text-align:center;pointer-events:none}
.celebrate.show{display:flex;animation:fade .3s}
.celebrate .big{font-size:72px;animation:celebpop .6s cubic-bezier(.2,1.4,.4,1)}
@keyframes celebpop{0%{transform:scale(0) rotate(-30deg)}70%{transform:scale(1.2) rotate(8deg)}100%{transform:scale(1) rotate(0)}}
.celebrate .ct{font-size:25px;font-weight:800;margin-top:10px;background:var(--gradA);-webkit-background-clip:text;background-clip:text;color:transparent}
.celebrate .cm{font-size:16px;font-weight:700;color:var(--ink);margin-top:12px;max-width:440px;line-height:1.4}
.celebrate .cx{font-size:15px;font-weight:800;color:var(--amber);margin-top:14px;background:rgba(251,191,36,.14);padding:8px 18px;border-radius:999px}
.celebrate.jackpot .ct{background:linear-gradient(135deg,#fbbf24,#22d3ee,#34d399);-webkit-background-clip:text;background-clip:text}

/* ===== SIMULACIÓN DE VUELO ===== */
.flightsim{position:fixed;inset:0;z-index:72;display:none;flex-direction:column;align-items:center;justify-content:center;
  background:radial-gradient(1200px 600px at 50% 120%,#0b2a5e 0%,transparent 60%),linear-gradient(180deg,#050b1c,#0a1440 70%,#0e2150)}
.flightsim.show{display:flex;animation:fade .3s}
.fs-stars{position:absolute;inset:0;background-image:radial-gradient(2px 2px at 20% 30%,#fff,transparent),radial-gradient(2px 2px at 70% 20%,#cfe0ff,transparent),radial-gradient(1px 1px at 40% 60%,#fff,transparent),radial-gradient(2px 2px at 85% 55%,#fff,transparent),radial-gradient(1px 1px at 55% 40%,#9fb2d8,transparent),radial-gradient(2px 2px at 15% 75%,#fff,transparent);opacity:.7}
.fs-route{position:relative;width:84%;max-width:620px;height:140px;margin-bottom:8px}
.fs-line{position:absolute;top:50%;left:0;right:0;height:0;border-top:3px dashed rgba(120,160,255,.45);border-radius:2px}
.fs-prog{position:absolute;top:50%;left:0;height:0;border-top:3px solid var(--cyan);border-radius:2px;box-shadow:0 0 10px var(--cyan);width:0;animation:fsprog 3.4s cubic-bezier(.5,0,.5,1) forwards}
@keyframes fsprog{to{width:100%}}
.fs-a,.fs-b{position:absolute;top:50%;transform:translateY(-50%);font-size:30px;filter:drop-shadow(0 3px 6px rgba(0,0,0,.5))}
.fs-a{left:-6px}.fs-b{right:-10px}
.fs-plane{position:absolute;top:50%;font-size:40px;left:0;transform:translate(-50%,-50%);animation:fsfly 3.4s cubic-bezier(.5,0,.5,1) forwards;filter:drop-shadow(0 4px 8px rgba(34,211,238,.5))}
@keyframes fsfly{0%{left:2%;transform:translate(-50%,-50%) rotate(-14deg) scale(.8)}15%{transform:translate(-50%,-140%) rotate(-8deg) scale(1)}50%{transform:translate(-50%,-180%) rotate(0) scale(1.1)}85%{transform:translate(-50%,-140%) rotate(8deg) scale(1)}100%{left:98%;transform:translate(-50%,-50%) rotate(12deg) scale(.85)}}
.fs-title{font-size:21px;font-weight:800;background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent;text-align:center;padding:0 16px}
.fs-sub{font-size:14px;color:var(--dim);margin-top:8px;text-align:center;max-width:440px;line-height:1.4;padding:0 16px}
.fs-badge{margin-top:16px;font-size:14px;font-weight:800;color:#2b1600;background:var(--gradA);padding:9px 20px;border-radius:999px;animation:pop .5s .4s both}

/* ===== ESCRITORIO ===== */
@media(min-width:900px){
  .screen{padding:22px 30px}
  .topbar{padding:12px 22px}
  #scr-path{max-width:1000px;margin:0 auto}
  .pathgrid{display:grid;grid-template-columns:minmax(0,1fr) 240px;gap:26px;align-items:start;max-width:920px;margin:0 auto}
  .path{max-width:600px}
  .badgestrip{display:none}
  .badgerail{display:block;position:sticky;top:80px;background:linear-gradient(180deg,#16265a,#0b1636);border:1px solid var(--line);border-radius:18px;padding:16px 13px;box-shadow:var(--sh)}
  .brail-head{text-align:center;padding-bottom:12px;margin-bottom:8px;border-bottom:1px solid var(--line)}
  .brail-title{font-size:14.5px;font-weight:800;background:var(--gradA);-webkit-background-clip:text;background-clip:text;color:transparent}
  .brail-rank{font-size:12px;color:var(--ink);font-weight:700;margin-top:5px}
  .brail-sub{font-size:10.5px;color:var(--dim2);margin-top:2px}
  .brail-track{display:flex;flex-direction:column;gap:2px}
  .brail-item{display:flex;align-items:center;gap:10px;padding:7px 8px;border-radius:11px;opacity:.4;transition:.2s}
  .brail-item.on{opacity:1;background:rgba(52,211,153,.1)}
  .brail-item.next{opacity:1;background:rgba(34,211,238,.12);border:1px solid rgba(34,211,238,.4)}
  .brail-ic{width:34px;height:34px;border-radius:10px;background:rgba(0,0,0,.3);display:grid;place-items:center;font-size:19px;filter:grayscale(1);flex-shrink:0}
  .brail-item.on .brail-ic{filter:none;background:rgba(52,211,153,.18)}
  .brail-item.next .brail-ic{filter:none;background:rgba(34,211,238,.18)}
  .brail-nm{font-size:11px;font-weight:700;color:var(--dim);line-height:1.15}
  .brail-item.on .brail-nm,.brail-item.next .brail-nm{color:var(--ink)}
  .brail-you{display:block;font-size:9px;font-weight:800;color:var(--cyan);margin-top:1px}
}
</style>
</head>
<body>
<canvas id="confetti"></canvas>
<div class="celebrate" id="celebrate">
  <div class="big" id="celebIcon">🎉</div>
  <div class="ct" id="celebTitle"></div>
  <div class="cm" id="celebMsg"></div>
  <div class="cx" id="celebXp"></div>
</div>
<div class="flightsim" id="flightsim">
  <div class="fs-stars"></div>
  <div class="fs-route"><div class="fs-line"></div><div class="fs-prog"></div>
    <div class="fs-a">🛫</div><div class="fs-b">🏁</div><div class="fs-plane">✈️</div></div>
  <div class="fs-title" id="fsTitle"></div>
  <div class="fs-sub" id="fsSub"></div>
  <div class="fs-badge" id="fsBadge"></div>
</div>

<!-- SELECCIÓN DE PILOTO -->
<section id="scr-profiles"></section>

<!-- APP -->
<div class="app" id="app">
  <div class="topbar">
    <div class="brand"><span class="logo">✈️</span><span class="bname">Tripulación Vélez Echand<span class="ia">IA</span></span></div>
    <div class="spacer"></div>
    <div class="stat streak" id="streakStat">🔥 0</div>
    <div class="stat xp" id="xpStat">⭐ 0</div>
    <button class="iconbtn" id="soundBtn" title="Sonido">🔊</button>
    <button class="miniava" id="miniAva" title="Cambiar piloto">🐦</button>
  </div>
  <section class="screen active" id="scr-path"></section>
  <section class="screen" id="scr-lesson"></section>
  <section class="screen" id="scr-profile"></section>
  <section class="screen" id="scr-session"></section>
  <section class="screen" id="scr-tutor"></section>
  <nav class="nav">
    <button class="navbtn active" data-nav="path"><span class="ni">🗺️</span>Camino</button>
    <button class="navbtn" data-nav="profile"><span class="ni">🏅</span>Perfil</button>
    <button class="navbtn" data-nav="tutor"><span class="ni">🎖️</span>Comandante</button>

       ex:"Verdadero. La gente ya le pregunta a la IA en vez de buscar como antes, y esa costumbre crece muy rápido."},
      {type:"fill",skill:"capacidades",q:"Frase clave: 'No es una era de cambio, es un cambio de ______.'",
       opts:["era","vida","rumbo","rutina"],a:0,ex:"Cambio de era: el mundo se está reorganizando alrededor de la IA. Y tú llegas temprano."},
      {type:"mc",skill:"capacidades",q:"¿Por qué recomendamos Fable solo para lo muy importante?",
       opts:["Porque es el más potente, pero tiene más límites de uso y es más lento","Porque solo funciona en inglés","Porque solo sirve para escribir textos largos","Porque no se puede usar desde el celular"],a:0,
       ex:"El más potente no siempre es el mejor para todo: Fable tiene más límites y es más lento, así que lo reservas para lo clave. Lo diario va con Opus. (Ojo: esto cambia rápido.)"},
      {type:"mission",skill:"capacidades",q:"",title:"Misión: pon a la IA a pescar por ti",
       intro:"Vas a ver algo real: le haces a la IA una pregunta de pesca DIFÍCIL (de las que solo un pescador experto sabe) y te la resuelve. Truco de piloto: pregunta difícil = modelo más fuerte.",
       steps:["Abre Claude. Busca dónde dice el modelo (en el computador suele estar ABAJO, al lado del cuadro de texto; en el celular, arriba). Como esta pregunta es DIFÍCIL, cámbialo al más fuerte (Opus).","Copia el prompt de abajo y pégalo. Cámbiale el pez por el que más te guste pescar.","Lee la tabla que te armó. Fíjate en algo que NO sabías: eso es la IA siendo tu tutor.","Guárdala: escríbele tú mismo 'resúmemela en 5 líneas para mi teléfono' y hazle captura. Esa es tu chuleta de pesca."],
       objetivo:"que la IA te arme una mini-guía de pesca de nivel experto (hora + carnada + condiciones) que normalmente aprenderías con años.",
       copy:"Actúa como un pescador deportivo experto de agua dulce en Colombia. Quiero pescar [pavón / bocachico / el pez que más me guste] en un río o embalse de mi región. Explícame, como si tuviera 15 años, cómo influyen la hora del día, la fase de la luna, la temperatura del agua y qué tan turbia está en que el pez PIQUE. Después arma una tabla sencilla que me diga, según cada condición: a qué hora ir, qué señuelo o carnada usar y cómo lanzarlo. Al final dame 3 errores de principiante que debo evitar.",
       botin:"Tu mini-guía de pesca: una tabla con a qué hora ir + qué carnada usar + 3 errores a evitar. La guardas en el teléfono y la usas la próxima vez que vayas a pescar de verdad.",xp:40}
    ]}
  ]},

  /* ===== ETAPA 2 · PLAN DE VUELO — Prompts ===== */
  {id:"e2",etapa:2,name:"Plan de Vuelo",tag:"Cómo pedirle bien a la IA",ic:"🧭",skill:"prompts",
   insignia:{id:"e2",ic:"🧭",n:"Navegante"},
   lessons:[
    {id:"e2l1",t:"Contexto y objetivo",d:"Los dos que nunca faltan",ex:[
      {type:"mc",skill:"prompts",q:"¿Qué dos cosas NUNCA pueden faltar en un buen prompt?",
       opts:["Emojis y mayúsculas","Contexto (tu situación) y objetivo (qué quieres)","Un rol y un ejemplo","Buena ortografía y que sea corto"],a:1,
       ex:"Contexto + objetivo = el corazón del prompt. Sin eso, la IA adivina."},
      {type:"improve",skill:"prompts",q:"¿Cuál pide mejor?",
       opts:["'ayúdame con lociones'","'Vendo lociones a jóvenes por Instagram. Dame 3 ideas para vender más esta semana.'"],a:1,
       why:"El segundo tiene contexto (lociones, jóvenes, Instagram) y objetivo (3 ideas para vender). Directo al blanco."},
      {type:"fill",skill:"prompts",q:"El ______ dice QUÉ quiero que haga la IA.",
       opts:["objetivo","contexto","rol","formato"],a:0,ex:"El objetivo es la tarea, sin rodeos: 'dame 3 ideas', 'resume esto', 'escribe un mensaje'."},
      {type:"detect",skill:"prompts",q:"¿Qué le falta a este prompt?",
       sub:"'Soy principiante y juego pádel 3 veces por semana.'",
       opts:["Nada, así está completo","Le falta el OBJETIVO: no dice qué quiere que haga la IA","Le falta el CONTEXTO: no dice nada de su situación","Le falta decir en cuántas palabras responder"],a:1,
       ex:"Tiene contexto pero no objetivo. ¿Un plan? ¿Consejos? Sin objetivo, la IA no sabe qué darte."},
      {type:"detect",skill:"prompts",q:"¿Y a este qué le falta?",
       sub:"'Dame 5 ideas.'",
       opts:["Nada, así está completo","Le falta el CONTEXTO: ideas ¿de qué, para quién?","Le falta el OBJETIVO: no dice qué quiere","Le falta pedirle que use un rol de experto"],a:1,
       ex:"Tiene objetivo (5 ideas) pero no contexto. La IA no sabe de qué tema ni para quién. Siempre los DOS."},
      {type:"tf",skill:"prompts",q:"Aunque no des contexto ni objetivo, la IA adivina lo que necesitas.",a:false,
       ex:"Falso. Sin contexto ni objetivo la IA responde a ciegas. Esos dos son los vitales: con ellos ya tienes medio prompt ganado."}
    ]},
    {id:"e2l2",t:"El rol: como un experto",d:"Importante, pero no vital",ex:[
      {type:"mc",skill:"prompts",q:"El 'rol' en un prompt es…",
       opts:["Decirle a la IA como QUIÉN debe actuar ('como un experto en...')","Ponerle un emoji al mensaje para que se vea amable","Decirle en cuántas palabras exactas debe responder","Pedirle que busque la respuesta en Google antes"],a:0,
       ex:"El rol enfoca la respuesta. Es muy importante, aunque no tan vital como contexto y objetivo."},
      {type:"improve",skill:"prompts",q:"¿Cuál usa mejor el 'cómo' del rol?",
       opts:["'como un experto'","'como un instructor de vuelo experimentado'"],a:1,
       why:"El truco está en el CÓMO del rol: entre más específico ('instructor de vuelo experimentado'), mejor la respuesta."},
      {type:"match",skill:"prompts",q:"Empareja el tema con un buen rol específico:",
       pairs:[{l:"Mejorar tu saque de pádel",r:"Como un entrenador experto de pádel"},{l:"Vender tus lociones",r:"Como un vendedor experto de perfumería"},{l:"Dudas de aviación",r:"Como un instructor de vuelo"}],
       ex:"Rol específico = respuesta enfocada. Entre más preciso el experto que pides, más útil te responde."},
      {type:"fill",skill:"prompts",q:"El rol es muy importante, pero no es tan ______ como el contexto y el objetivo.",
       opts:["vital","urgente","técnico","llamativo"],a:0,ex:"Sin rol el prompt funciona; sin contexto ni objetivo, no. Por eso esos dos van primero."},
      {type:"tf",skill:"prompts",q:"'Como un médico experto en gastroenterología' es mejor que 'como un doctor'.",a:true,
       ex:"Verdadero. Entre más específico el experto, más experta la respuesta. Ese es el 'cómo' del rol."}
    ]},
    {id:"e2l3",t:"Trucos y tu comando",d:"Hacks + -Marlin",ex:[
      {type:"mc",skill:"prompts",q:"Un buen 'hack' para tareas difíciles es…",
       opts:["Pedir 'paso a paso' para que la IA piense en orden","Escribir todo en mayúsculas para que le dé más importancia","Repetir la misma pregunta varias veces seguidas","Mandar el pedido en varios mensajes sueltos y sin contexto"],a:0,
       ex:"'Hazlo paso a paso' hace que la IA razone ordenada y falle menos. Truco de piloto experto."},
      {type:"mc",skill:"prompts",q:"Otro hack útil es 'dividir tareas'. ¿Qué significa?",
       opts:["Partir un pedido grande en partes pequeñas","Pedirle lo mismo a dos IA distintas y comparar","Escribir el mismo pedido en dos idiomas","Repartir la respuesta en dos conversaciones"],a:0,
       ex:"Un pedido enorme confunde. Divídelo: primero esto, luego esto. Más control, mejor resultado."},
      {type:"mc",skill:"prompts",q:"Tu comando personal '-Marlin' (que TÚ inventaste) sirve para…",
       opts:["Que la respuesta salga con el formato adaptado a ti","Que la IA busque en internet antes de responder","Que la IA guarde la conversación para después","Que la respuesta salga siempre más corta"],a:0,
       ex:"-Marlin es TUYO, Daniel: lo bautizaste como el pez, y hace que la respuesta salga a tu medida. ¡Tu sello personal!"},
      {type:"tf",skill:"prompts",eth:true,q:"'-Marlin' es un comando universal que funciona en cualquier chat del mundo.",a:false,
       ex:"Falso. Es TU comando personal, que configuraste para tu Claude. Es especial porque es tuyo, no de todos."},
      {type:"fill",skill:"prompts",q:"Si algo no me sirve, no me rindo: le pido a la IA que lo ______.",
       opts:["mejore","repita igual","traduzca","acorte"],a:0,ex:"Iterar (pedir 'mejóralo', 'hazlo más corto') es normal. La primera respuesta es un borrador."}
    ]},
    {id:"e2l4",t:"Imágenes con IA",d:"Tu primer vistazo + misión",ex:[
      {type:"mc",skill:"prompts",q:"Para que la IA cree la imagen que imaginas, hay que…",
       opts:["Describirla con detalle: qué, colores, estilo","Decir solo el objeto y dejar que la IA elija lo demás","Pedir muchas imágenes a la vez y escoger la que sirva","Escribir la descripción en mayúsculas"],a:0,
       ex:"La IA pinta lo que describes. 'Un avión' es poco; 'un avión rojo despegando al atardecer, realista' es oro."},
      {type:"improve",skill:"prompts",q:"¿Cuál describe mejor una imagen para tu loción?",
       opts:["'una loción'","'frasco de loción azul sobre fondo deportivo, luz suave, estilo moderno'"],a:1,
       why:"Da objeto, color, fondo, luz y estilo. Con eso la imagen sale como la quieres."},
      {type:"tf",skill:"prompts",q:"Si le describo bien una imagen, ChatGPT me la puede crear.",a:true,
       ex:"Verdadero. Como el ejemplo que Andrés les mostró: describes con detalle y la IA la crea."},
      {type:"mission",skill:"prompts",q:"",title:"Misión: un prompt que te vende lociones",
       intro:"Arma un prompt maestro (rol + contexto + objetivo + tu comando -Marlin) y sácale un plan de ventas real para tu negocio.",
       steps:["Abre Claude o ChatGPT.","Copia el prompt y cámbiale lo que está entre [corchetes] por lo tuyo real.","Envíalo y lee las 3 ideas que te da.","Escoge la que MÁS te sirva y contéstale tú mismo: 'de esa idea, dame el paso 1 para hacer HOY'. Ese paso es tu tarea de hoy."],
       objetivo:"que la IA te dé 3 ideas para vender más lociones esta semana, y luego el primer paso concreto de la que elijas.",
       copy:"Como un vendedor experto de perfumería para jóvenes, tengo un negocio de lociones que vendo por [Instagram / WhatsApp / en el colegio]. Mi público son [amigos y conocidos de 14 a 18 años]. Dame 3 ideas realistas y baratas para vender más esta semana, explicadas fácil. -Marlin",
       botin:"El paso 1 concreto para vender más lociones HOY. No una teoría: una acción que puedes hacer esta tarde.",xp:35}
    ]}
  ]},

  /* ===== ETAPA 3 · CARTOGRAFÍA — Imágenes, voz e investigación (clase 3) ===== */
  {id:"e3",etapa:3,name:"Cartografía Visual",tag:"Imágenes, hablarle a la IA e investigar a fondo",ic:"🎨",skill:"imagenes",
   insignia:{id:"e3",ic:"🎨",n:"Cartógrafo"},
   lessons:[
    {id:"e3l1",t:"Describir bien",d:"Las palabras pintan",ex:[
      {type:"mc",skill:"imagenes",q:"¿Qué hace que una imagen con IA salga mejor?",
       opts:["Una descripción con detalle (qué, color, luz, estilo)","Un nombre corto y dejar que la IA complete lo demás","Escribir la descripción toda en mayúsculas","Pedir muchas versiones y quedarse con la mejor"],a:0,
       ex:"Detalle = imagen a tu medida. Objeto, colores, fondo, luz y estilo. No importan las mayúsculas ni la cantidad."},
      {type:"order",skill:"imagenes",q:"Ordena la receta que aprendiste para describir una imagen:",
       items:["Qué es (un guacamayo piloto)","Cómo se ve (gafas de aviador, bufanda)","Estilo y ambiente (caricatura, cielo azul)"],
       ex:"Objeto → detalles → estilo. Con esa receta la imagen sale como la imaginas."},
      {type:"fill",skill:"imagenes",q:"En una imagen puedo definir el ______: realista, caricatura, 3D…",
       opts:["estilo","precio","peso","idioma"],a:0,ex:"El estilo cambia todo. Pídelo claro: 'estilo caricatura', 'foto realista'."},
      {type:"tf",skill:"imagenes",q:"Para las imágenes es mejor escribir poquito: si describes mucho, la IA se confunde.",a:false,
       ex:"Falso. Es al revés: entre más detalle útil (color, luz, estilo), mejor sale. Practica describir con detalle."}
    ]},
    {id:"e3l2",t:"Estilo e iterar",d:"El mismo objeto, mil looks",ex:[
      {type:"match",skill:"imagenes",q:"Empareja el estilo con lo que transmite:",
       pairs:[{l:"Realista",r:"Parece foto de verdad"},{l:"Caricatura",r:"Divertido y juvenil"},{l:"Minimalista",r:"Limpio y elegante"}],
       ex:"Elige el estilo según el mensaje. Para lociones juveniles, algo fresco funciona genial."},
      {type:"improve",skill:"imagenes",q:"La imagen salió casi bien. ¿Cómo la mejoras?",
       opts:["'otra'","'igual pero con fondo azul cielo y más luz'"],a:1,
       why:"Cambios concretos (fondo, luz) guían la nueva versión. Iterar es normal."},
      {type:"fill",skill:"imagenes",q:"Si la imagen no me gusta, la ______: cambio un detalle y pido de nuevo.",
       opts:["itero","borro","escondo","vendo"],a:0,ex:"Iterar imágenes es normal: ajusta color, fondo o luz y vuelve a generar."},
      {type:"detect",skill:"imagenes",q:"Tu imagen salió sosa. ¿Qué le faltó?",
       sub:"Pediste: 'un frasco'.",
       opts:["Nada, la IA simplemente falló","Le faltó estilo, color, fondo y ambiente","Le faltó pedir varias","Le faltó pedirla en inglés"],a:1,ex:"'Un frasco' es muy poco. No es culpa del idioma ni de la cantidad: agrega color, fondo, luz y estilo."}
    ]},
    {id:"e3l3",t:"Contenido que vende",d:"Imagen + texto",ex:[
      {type:"mc",skill:"imagenes",q:"¿Qué hace que una pieza publicitaria funcione?",
       opts:["Una imagen bonita, que ya habla por sí sola","Una imagen atractiva junto a un texto corto que dé ganas de comprar","Un texto largo que explique todo el producto","Muchos hashtags para que llegue a más gente"],a:1,
       ex:"Imagen que llama + frase que convence. Juntas venden. Sola la imagen o solo texto largo se quedan cortos."},
      {type:"improve",skill:"imagenes",q:"¿Cuál texto es mejor para tu loción?",
       opts:["'loción en venta'","'Tu aroma, tu jugada. Fresco para ganar el día. 😎'"],a:1,
       why:"El segundo tiene gancho y personalidad juvenil. 'loción en venta' no emociona."},
      {type:"tf",skill:"imagenes",eth:true,q:"Está bien poner el logo de otra marca en mi anuncio para engañar.",a:false,
       ex:"Falso. Usar la marca de otro para engañar es deshonesto y hasta ilegal. Crea lo tuyo, con honestidad."},
      {type:"fill",skill:"imagenes",q:"Una buena publicidad no describe: hace ______.",
       opts:["sentir","dudar","comparar","calcular"],a:0,ex:"La publicidad conecta emociones: frescura, energía, confianza. Ahí está la venta."}
    ]},
    /* --- Tema corto pero clave: hablarle a la IA en vez de escribirle --- */
    {id:"e3l4",t:"Hablarle a la IA",d:"Tu voz es más rápida que tus dedos",ex:[
      {type:"mc",skill:"voz",q:"¿Por qué conviene HABLARLE a la IA en vez de escribirle?",
       opts:["Porque hablamos unas 4 veces más rápido de lo que escribimos","Porque la IA entiende mejor la voz que el texto","Porque escribiendo la IA no capta bien lo que uno quiere","Porque hablando no hace falta dar contexto ni objetivo"],a:0,
       ex:"Hablamos como 4 veces más rápido de lo que escribimos. Por eso puedes darle MUCHO más contexto en el mismo tiempo, y el contexto es justo lo que hace buena la respuesta."},
      {type:"mc",skill:"voz",q:"Estás en modo voz y le haces una pregunta difícil. ¿Cuál es el truco de experto?",
       opts:["Dictar para que quede en TEXTO y ahí sí responda el modelo bueno","Quedarse en modo voz: es el mismo modelo, solo que hablado","Repetir la pregunta más despacio hasta que responda mejor","Hacer la pregunta en partes cortas para no confundirlo"],a:0,
       ex:"Ojo con esto: el modo voz usa un modelo más rápido (y por eso menos profundo), porque tiene que contestarte al instante como en una conversación. El truco de experto: usa la voz para DICTAR y que quede escrito, y deja que responda el modelo bueno. Hablas rápido y piensas profundo."}
    ]},
    /* --- Proyectos: el espacio con memoria y materiales propios --- */
    {id:"e3l5",t:"Proyectos",d:"Un espacio que ya te conoce",ex:[
      {type:"mc",skill:"investigar",q:"Un 'Proyecto' en la IA sirve para…",
       opts:["Guardar en un mismo espacio tus archivos e instrucciones, y no repetir el contexto cada vez","Programar una tarea para que se ejecute sola cada semana","Guardar las imágenes que has generado","Compartir tu conversación con otras personas"],a:0,
       ex:"Un Proyecto es como una carpeta con memoria: le dejas tus archivos y tus instrucciones fijas una vez, y todas las conversaciones de ahí adentro ya saben quién eres y en qué andas."},
      {type:"tf",skill:"investigar",q:"En un Proyecto puedo dejar escrito de una vez cómo quiero que me respondan todos los chats de ese Proyecto.",a:true,
       ex:"Verdadero. Son las instrucciones del proyecto: 'soy Daniel, tengo 15 años, vendo lociones, respóndeme corto y sin tecnicismos'. Se escribe UNA vez y vale para todo el proyecto."},
      {type:"mc",skill:"investigar",q:"¿Cuál sería un buen Proyecto para ti?",
       opts:["'Mi negocio de lociones', con tus precios, fotos y tu forma de vender","Una sola pregunta suelta sobre una tarea del colegio","Una imagen de un frasco que te gustó","Un dato que quieres verificar rápido"],a:0,
       ex:"Los Proyectos brillan en lo que REPITES: tu negocio, tus estudios, tu entrenamiento. Para una pregunta suelta no vale la pena."},
      {type:"fill",skill:"investigar",q:"La gracia del Proyecto es no tener que repetir el ______ cada vez.",
       opts:["contexto","precio","idioma","formato"],a:0,
       ex:"El contexto queda guardado. Por eso las respuestas salen afinadas desde el primer mensaje."}
    ]},
    {id:"e3l6",t:"Investigación a fondo",d:"Deep Research",ex:[
      {type:"mc",skill:"investigar",q:"La 'investigación a fondo' (Deep Research) sirve para…",
       opts:["Que la IA investigue, contraste y te entregue un informe con fuentes","Que la IA invente datos rápido sin revisar","Que guarde tus archivos ordenados","Que traduzca una palabra al inglés"],a:0,
       ex:"Deep Research busca en muchas fuentes, las cruza y te da un reporte ordenado con fuentes. Como un asistente investigador."},
      {type:"tf",skill:"investigar",q:"Deep Research puede entregar resúmenes con tablas y fuentes.",a:true,
       ex:"Verdadero. Investiga, sintetiza, cita y te entrega algo estructurado. Genial para un reporte."},
      {type:"fill",skill:"investigar",eth:true,q:"Aunque la IA investigue, yo ______ los datos importantes en una fuente real.",
       opts:["verifico","resumo","comparto","guardo"],a:0,ex:"Verificar sigue siendo tu trabajo. La IA acelera; tú confirmas la verdad."},
      {type:"mc",skill:"investigar",q:"¿Para qué te serviría a ti Deep Research?",
       opts:["Hacer un mini-reporte de aviones, peces o Nacional, con fuentes","Escribir un mensaje corto de WhatsApp","Crear una imagen bonita","Corregir la ortografía de un texto"],a:0,
       ex:"Su fuerte es investigar a fondo con fuentes. Elige un tema tuyo y practica a verificar lo que te da."}
    ]},
    {id:"e3l7",t:"NotebookLM",d:"Tu cuaderno inteligente",ex:[
      {type:"mc",skill:"investigar",q:"NotebookLM es útil para…",
       opts:["Cargar tus documentos y que la IA te los explique y resuma","Buscar cualquier cosa en todo internet","Crear imágenes desde cero","Chatear sin darle ningún material"],a:0,
       ex:"NotebookLM trabaja con TUS materiales (apuntes, PDF): resúmenes, preguntas, hasta audios. No sale a buscar a todo internet."},
      {type:"tf",skill:"investigar",q:"NotebookLM saca sus respuestas buscando en todo internet.",a:false,
       ex:"Falso. Responde con TUS documentos, los que le cargaste. Por eso es genial para estudiar."},
      {type:"match",skill:"investigar",q:"Empareja cada herramienta de investigación con lo que hace:",
       pairs:[{l:"Deep Research",r:"Investiga en internet y cita fuentes"},{l:"NotebookLM",r:"Estudia TUS documentos"}],
       ex:"Deep Research sale a buscar; NotebookLM trabaja con lo que TÚ le cargas."},
      {type:"fill",skill:"investigar",q:"NotebookLM te ayuda a ______ mejor tus apuntes y materiales.",
       opts:["estudiar","imprimir","vender","borrar"],a:0,ex:"Cargas el tema y te lo explica fácil. Un cuaderno que responde."}
    ]},
    {id:"e3l8",t:"Verificar y citar",d:"El radar del piloto",ex:[
      {type:"detect",skill:"investigar",q:"Detecta la señal de alerta:",
       sub:"'Según un estudio, el 87,3% de los peces prefieren salsa.'",
       opts:["Es un dato serio: viene de un estudio","Cifra rarísima + fuente que no puedo comprobar = a verificar","Está bien, porque trae un porcentaje exacto","Se puede publicar citando que lo dijo la IA"],a:1,
       ex:"Cifras exactas raras que no puedes comprobar son clásicas alucinaciones. Verifica."},
      {type:"mc",skill:"investigar",eth:true,q:"En tu reporte, citar la fuente sirve para…",
       opts:["Que la IA no vuelva a equivocarse en ese dato","Que otros (y tú) comprueben que el dato es real","Que la IA responda más rápido la próxima vez","Que la respuesta ocupe menos espacio"],a:1,
       ex:"Citar = decir de dónde salió el dato, para que cualquiera pueda ir a comprobarlo. Así trabajan los pros."},
      {type:"tf",skill:"investigar",q:"Encontrar un error de la IA en tu reporte es un logro, no un fracaso.",a:true,
       ex:"Verdadero. Cazar el error prueba que tu radar funciona. Los mejores revisan lo que da la IA."},
      {type:"fill",skill:"investigar",q:"Lema del Radar: 'Confía, pero ______.'",
       opts:["verifica","resume","traduce","guarda"],a:0,ex:"'Confía, pero verifica.' El radar del piloto de información."}
    ]}
  ]},

  /* ===== ETAPA 4 · COPILOTO — Claude Cowork ===== */
  {id:"e4",etapa:4,name:"Copiloto",tag:"La IA que trabaja en tu computador",ic:"🤝",skill:"cowork",
   insignia:{id:"e4",ic:"🤝",n:"Copiloto de a bordo"},
   lessons:[
    {id:"e4l1",t:"¿Qué es Cowork?",d:"La IA con tus archivos",ex:[
      {type:"mc",skill:"cowork",q:"Claude Cowork es una IA que…",
       opts:["Trabaja con tus archivos y te entrega cosas listas","Responde en un chat, pero no puede tocar tus archivos","Busca en internet y te muestra una lista de enlaces","Genera imágenes a partir de una descripción"],a:0,

function esc(s){ return String(s==null?"":s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
/* El id del piloto se deriva de SU NOMBRE (no un código al azar): así, si algún día se
   pierde el almacenamiento del equipo, "Daniel" vuelve a caer en la misma fila de la nube
   y recupera su progreso solo, sin tener que escribir ningún código. */
function slugId(nombre){
  let s=String(nombre||"").normalize("NFD").replace(/[\u0300-\u036f]/g,"")
        .toLowerCase().replace(/[^a-z0-9]+/g,"").slice(0,14);
  return s||("p"+Date.now().toString(36).slice(-5));
}
function idLibre(nombre,exceptoId){ const base=slugId(nombre); let id=base,n=2;
  while(PROFILES.some(p=>p.id===id&&p.id!==exceptoId)){ id=base+n; n++; } return id; }
function normNombre(n){ return String(n||"").normalize("NFD").replace(/[\u0300-\u036f]/g,"").toLowerCase().trim(); }

/* El 28/07/2026 la etapa 4 (Radar) se fusionó dentro de la 3, así que las etapas
   5..10 pasaron a ser 4..9. Esto mueve el progreso viejo a los ids nuevos para que
   nadie pierda insignias ni lecciones ya hechas. Se ejecuta una sola vez. */
function migrarIds(st){
  if(!st || st._mig>=2) return st;
  const mapa={}; for(let v=5;v<=10;v++) mapa["e"+v]="e"+(v-1);
  const mueve=obj=>{ if(!obj) return obj; const out={};
    Object.keys(obj).forEach(k=>{ const m=k.match(/^e(\d+)(l\d+)?(#\d+)?$/);
      if(m && mapa["e"+m[1]]) out[mapa["e"+m[1]]+(m[2]||"")+(m[3]||"")]=obj[k]; else out[k]=obj[k]; });
    return out; };
  st.done=mueve(st.done); st.moduleDone=mueve(st.moduleDone); st.fails=mueve(st.fails);
  st.review=[];               // los repasos guardaban posiciones que ya cambiaron
  st._mig=2; return st;
}

const SYNC_URL="https://capitan-echandia-sync.netlify.app/.netlify/functions/sync";

function cloudGet(row){ return fetch(SYNC_URL+"?id="+encodeURIComponent(row))
  .then(r=>r.ok?r.text():null).then(t=>{ if(!t||t==='null')return null; try{return JSON.parse(t);}catch(e){return null;} })
  .catch(()=>null); }

/* Trae el progreso del piloto: mira su fila principal y también sus filas
   viejas (aka), y se queda con la que tenga MÁS avance. Nunca pierde nada. */
function bestStateFor(p){ const filas=["cve_"+p.id].concat((p.aka||[]).map(a=>"cve_"+a));
  return Promise.all(filas.map(cloudGet)).then(rs=>{
    let mejor=null; rs.forEach(r=>{ if(!r) return;
      if(!mejor){ mejor=r; return; }
      const a=progressScore(r), b=progressScore(mejor);
      // gana el que más avance tenga; si empatan, el guardado más reciente
      if(a>b || (a===b && (r._t||0)>(mejor._t||0))) mejor=r; });
    return mejor?migrarIds(mejor):null; }); }
function cloudLoad(cb){
  const p=activeProfile(); if(!p){ cloudReady=true; if(cb)cb(); return; }
  bestStateFor(p).then(remote=>{
    if(remote && progressScore(remote)>progressScore(S)){ S=Object.assign(DEFAULT_STATE(),remote); saveLocal(); }
    cloudReady=true; setCloud(true); refreshTop(); if(cb)cb();
  }).catch(()=>{ cloudReady=true; setCloud(false); if(cb)cb(); });
}

/* --- lista de pilotos compartida --- */
function fusionarPilotos(a,b){            // une dos listas sin perder a nadie
  const out=[]; const porNombre={};
  (a||[]).concat(b||[]).forEach(p=>{
    if(!p||!p.id||!p.name) return;
    const k=normNombre(p.name); const ya=porNombre[k];
    if(!ya){ const c=Object.assign({},p,{aka:(p.aka||[]).slice()}); porNombre[k]=c; out.push(c); return; }
    // mismo nombre en dos equipos: se queda uno y el otro id se guarda como "aka"
    if(ya.id!==p.id && ya.aka.indexOf(p.id)<0) ya.aka.push(p.id);
    (p.aka||[]).forEach(x=>{ if(x!==ya.id && ya.aka.indexOf(x)<0) ya.aka.push(x); });
    if((p.created||0) && (!ya.created || p.created<ya.created)) ya.created=p.created;
    if(!ya.callsign && p.callsign) ya.callsign=p.callsign;
    if((p.visto||0) > (ya.visto||0)) ya.visto=p.visto;
    if((p.editado||0) > (ya.editado||0)){ ya.name=p.name; ya.avatar=p.avatar; ya.callsign=p.callsign; ya.editado=p.editado; }
  });
  // El id principal SIEMPRE se lleva al derivado del nombre (dani, andres, olguita…).
  // Los ids viejos quedan como "aka" para no perder nunca su progreso.
  const usados={};
  out.forEach(p=>{ let base=slugId(p.name), id=base, n=2;
    while(usados[id]) { id=base+n; n++; }
    usados[id]=1;
    if(p.id!==id){ if(p.aka.indexOf(p.id)<0) p.aka.push(p.id); p.id=id; }
    p.aka=p.aka.filter(x=>x&&x!==id);
  });
  return out.slice(0,MAX_PILOTOS);
}
/* Publica la lista en la nube fusionando primero con lo que ya haya allá,
   para que dos celulares no se pisen el uno al otro. */
let rosterTimer=null;
function pushRoster(inmediato){
  clearTimeout(rosterTimer);
  const hacerlo=()=>cloudGet(ROSTER_ROW).then(rem=>{
    const fusion=fusionarPilotos(PROFILES,(rem&&rem.pilots)||[]);
    PROFILES=fusion; saveProfiles(PROFILES);
    return cloudPut(ROSTER_ROW,{pilots:fusion,_t:Date.now()},inmediato);
  });
  if(inmediato) return hacerlo();
  rosterTimer=setTimeout(hacerlo,900); return Promise.resolve(true);
}
function pullRoster(){ return cloudGet(ROSTER_ROW).then(rem=>{
  const antes=JSON.stringify(PROFILES);
  const fusion=fusionarPilotos(PROFILES,(rem&&rem.pilots)||[]);
  PROFILES=fusion; saveProfiles(PROFILES);
  remapActivo();
  // si este equipo aportaba pilotos que la nube no tenía, los publica
  const remIds=((rem&&rem.pilots)||[]).map(p=>p.id).sort().join(',');
  if(remIds!==fusion.map(p=>p.id).sort().join(',')) cloudPut(ROSTER_ROW,{pilots:fusion,_t:Date.now()});
  return JSON.stringify(PROFILES)!==antes; }).catch(()=>false); }
/* Si el id de un piloto cambió al normalizarse, el piloto activo y su progreso
   guardado en este equipo se mueven al id nuevo (sin perder nada). */
function remapActivo(){ if(!activeId) return;
  if(PROFILES.some(p=>p.id===activeId)) return;
  const p=PROFILES.find(x=>(x.aka||[]).indexOf(activeId)>=0); if(!p) return;
  try{ const viejo=localStorage.getItem(STATE_PREFIX+activeId);
       const nuevo=localStorage.getItem(STATE_PREFIX+p.id);
       const pts=s=>{ try{const d=JSON.parse(s);return (d.lessonsCount||0)*10000+(d.xp||0);}catch(e){return -1;} };
       if(viejo && pts(viejo)>pts(nuevo)) localStorage.setItem(STATE_PREFIX+p.id,viejo);
  }catch(e){}
  activeId=p.id; try{localStorage.setItem(ACTIVE_KEY,activeId);}catch(e){} }

function bumpStreak(){ const t=todayBogota(); if(S.lastDay===t) return;
  if(S.lastDay===prevDay(t)){ S.streak++; }
  else if(S.lastDay){ if((S.streakShield||0)>0){ S.streakShield--; S.streak++; toast("🛡️ Escudo de racha usado: ¡tu racha sigue viva!"); } else { S.streak=1; } }
  else { S.streak=1; }

}

function ac(){ if(!AC){ try{AC=new(window.AudioContext||window.webkitAudioContext)();}catch(e){} } return AC; }
function beep(freqs,dur,type,gain){ if(S.muted)return; const c=ac(); if(!c)return; if(c.state==='suspended')c.resume(); let t=c.currentTime;
  freqs.forEach(f=>{ const o=c.createOscillator(),g=c.createGain(); o.type=type||'sine'; o.frequency.value=f; g.gain.setValueAtTime(0,t); g.gain.linearRampToValueAtTime(gain||.13,t+.01); g.gain.exponentialRampToValueAtTime(.0001,t+(dur||.1)); o.connect(g); g.connect(c.destination); o.start(t); o.stop(t+(dur||.1)); t+=(dur||.1)*.9; }); }
function sweep(f1,f2,dur,type,gain){ if(S.muted)return; const c=ac(); if(!c)return; if(c.state==='suspended')c.resume(); const o=c.createOscillator(),g=c.createGain(); o.type=type||'sawtooth'; o.frequency.setValueAtTime(f1,c.currentTime); o.frequency.exponentialRampToValueAtTime(f2,c.currentTime+dur); g.gain.setValueAtTime(gain||.08,c.currentTime); g.gain.exponentialRampToValueAtTime(.0001,c.currentTime+dur); o.connect(g); g.connect(c.destination); o.start(); o.stop(c.currentTime+dur); }

const cvs=document.getElementById('confetti'), ctx=cvs.getContext('2d');
let parts=[], confAnim=null;
function sizeCanvas(){ cvs.width=innerWidth; cvs.height=innerHeight; }
addEventListener('resize',sizeCanvas); sizeCanvas();
function burst(n){ n=n||140; sizeCanvas(); cvs.style.display='block'; const colors=['#22d3ee','#fbbf24','#34d399','#3b82f6','#f97316','#ffffff','#22c55e'];
  for(let i=0;i<n;i++){ parts.push({x:innerWidth/2+(Math.random()-.5)*140,y:innerHeight*.38,vx:(Math.random()-.5)*11,vy:Math.random()*-13-4,g:.32+Math.random()*.2,s:6+Math.random()*7,r:Math.random()*6,vr:(Math.random()-.5)*.5,c:colors[(Math.random()*colors.length)|0],life:70+Math.random()*40}); }
  if(!confAnim) confAnim=requestAnimationFrame(stepConf); }
function stepConf(){ ctx.clearRect(0,0,cvs.width,cvs.height); parts.forEach(p=>{ p.vy+=p.g; p.x+=p.vx; p.y+=p.vy; p.r+=p.vr; p.life--; ctx.save(); ctx.translate(p.x,p.y); ctx.rotate(p.r); ctx.fillStyle=p.c; ctx.fillRect(-p.s/2,-p.s/2,p.s,p.s*.6); ctx.restore(); });
  parts=parts.filter(p=>p.life>0&&p.y<innerHeight+40); if(parts.length){ confAnim=requestAnimationFrame(stepConf); } else { confAnim=null; ctx.clearRect(0,0,cvs.width,cvs.height); cvs.style.display='none'; } }

/* riel de insignias */
function icH(obj,px){ if(obj&&obj.logo&&typeof LOGO_URI!=='undefined'&&LOGO_URI){ return `<img src="${LOGO_URI}" alt="${(obj.n||'insignia')}" style="width:${px}px;height:${px}px;object-fit:contain;display:inline-block;vertical-align:middle;filter:drop-shadow(0 2px 5px rgba(212,175,55,.55))">`; } return obj?obj.ic:''; }
function badgeData(){ const order=allBadges(); let nextId=null; for(let i=0;i<CURRICULUM.levels.length;i++){ if(!S.moduleDone[CURRICULUM.levels[i].id]){ nextId=CURRICULUM.levels[i].insignia.id; break; } } return {order,nextId,earned:badgesEarned()}; }
function badgeRailHTML(){ const {order,nextId,earned}=badgeData(); const r=rankFor(S.xp);
  const items=order.slice().reverse().map(b=>{ const on=!!S.moduleDone['e'+order.indexOf(b)]; const done=isBadgeOn(b.id); const isNext=b.id===nextId;
    return `<div class="brail-item ${done?'on':''} ${isNext?'next':''}"><div class="brail-ic">${icH(b,30)}</div><div class="brail-nm">${b.n}${isNext?'<span class="brail-you">◄ vas aquí</span>':''}</div></div>`; }).join('');
  return `<aside class="badgerail"><div class="brail-head"><div class="brail-title">🏅 Ruta a Capitán</div>
    <div class="brail-rank">${icH(r,20)} ${r.n} · ${earned}/${order.length}</div><div class="brail-sub">Cada insignia te acerca al simulador real</div></div>
    <div class="brail-track">${items}</div></aside>`; }
function isBadgeOn(id){ const lv=CURRICULUM.levels.find(l=>l.insignia.id===id); return lv&&!!S.moduleDone[lv.id]; }
function badgeStripHTML(){ const {order,nextId,earned}=badgeData();
  const items=order.map(b=>{ const done=isBadgeOn(b.id); const isNext=b.id===nextId;
    return `<div class="bstrip-item ${done?'on':''} ${isNext?'next':''}"><div class="bstrip-ic">${icH(b,38)}</div><div class="bstrip-n">${b.n}</div></div>`; }).join('');
  return `<div class="badgestrip"><div class="bstrip-h">🏅 Insignias ${earned}/${order.length} · <b>rumbo a Capitán</b></div><div class="bstrip-track">${items}</div></div>`; }

let CUR=null, SEL=null, ORDER=null, MATCH=null, SHUF=null, answered=false;
const elCheck=document.getElementById('checkbar'), elFb=document.getElementById('feedback');
function startLesson(i,j){ const ls=CURRICULUM.levels[i].lessons[j]; CUR={li:i,lj:j,exs:ls.ex.map((e,ei)=>({e,ei})),idx:0,mistakes:0,isReview:false,counted:{}}; renderExercise(); show('lesson'); }
function choosePractice(){ const started=CURRICULUM.levels.filter(l=>l.lessons.some(ls=>S.done[ls.id]));
  if(!started.length){ toast("Primero completa alguna lección"); return; }
  let h=`<h3>🎯 Práctica libre</h3><p>Elige el tema que quieras repasar. Ganas XP y puede caer un jackpot. ¡Tú decides!</p>`;

function startPractice(i){ closeOverlay(); const lv=CURRICULUM.levels[i]; const exs=[];
  lv.lessons.forEach(ls=>ls.ex.forEach((e,ei)=>{ if(e.type!=='mission') exs.push({e,ei:lv.id+'-'+ls.id+'-'+ei}); }));
  exs.sort(()=>Math.random()-.5); CUR={li:-1,lj:-1,exs:exs.slice(0,8),idx:0,mistakes:0,isReview:true,counted:{}}; renderExercise(); show('lesson'); }
function startReview(){ if(!S.review.length){ toast('Radar limpio: sin errores pendientes ✈️'); return; }
  const exs=S.review.map(ref=>({e:(CURRICULUM.levels[ref.li]&&CURRICULUM.levels[ref.li].lessons[ref.lj]&&CURRICULUM.levels[ref.li].lessons[ref.lj].ex[ref.ei]),ei:ref.ei,ref})).filter(x=>x.e);
  CUR={li:-1,lj:-1,exs,idx:0,mistakes:0,isReview:true,counted:{}}; renderExercise(); show('lesson'); }
function tagName(t){ return ({mc:'Elige',improve:'Mejora el prompt',fill:'Completa',tf:'Verdadero o falso',detect:'Detecta el error',order:'Ordena',match:'Empareja',mission:'Misión real'})[t]||'Ejercicio'; }
function renderExercise(){ answered=false; SEL=null; ORDER=null; MATCH=null; SHUF=null; hideFeedback(); hideCheck();
  const total=CUR.exs.length, cur=CUR.idx; const {e}=CUR.exs[cur]; const pct=Math.round((cur/total)*100);
  let head=`<div class="lessonhead"><button class="x" onclick="APP.quitLesson()">✕</button><div class="pbar"><i style="width:${pct}%"></i></div></div>`;
  let body='';
  if(e.type==='mission'){ body=renderMission(e); document.getElementById('scr-lesson').innerHTML=head+body; showCheck('✅ Marcar misión como hecha','amber','APP.doMission()'); return; }
  const tag=e.eth?`<span class="qtag eth">🛡️ Seguridad y ética</span>`:`<span class="qtag">${tagName(e.type)}</span>`;
  if(e.type==='order'){ body=`<div class="qcard">${tag}<div class="qtext">${e.q}</div><div class="orderzone" id="orderzone"></div><div class="opts" id="bank"></div></div>`; }
  else if(e.type==='match'){ body=`<div class="qcard">${tag}<div class="qtext">${e.q}</div><div id="matchbox" style="margin:6px 0 4px"></div></div>`; }
  else { const sub=e.sub?`<div class="qsub">${e.sub}</div>`:''; let opts;
    if(e.type==='tf'){ SHUF=null; opts=['Verdadero','Falso']; }
    else { // Se BARAJAN las opciones: así la correcta no cae siempre en el mismo lugar
           // y no se puede aprobar "dándole siempre a la primera".
      SHUF=e.opts.map((_,i)=>i); for(let i=SHUF.length-1;i>0;i--){ const j=(Math.random()*(i+1))|0; const t=SHUF[i]; SHUF[i]=SHUF[j]; SHUF[j]=t; }
      opts=SHUF.map(i=>e.opts[i]); }
    const o=opts.map((op,k)=>`<button class="opt" data-k="${k}" onclick="APP.pick(${k})"><span class="k">${e.type==='tf'?(k===0?'V':'F'):String.fromCharCode(65+k)}</span><span>${op}</span></button>`).join('');
    body=`<div class="qcard">${tag}<div class="qtext">${e.q}</div>${sub}<div class="opts">${o}</div></div>`; }
  document.getElementById('scr-lesson').innerHTML=head+body;
  if(e.type==='order') buildOrder(e); if(e.type==='match') buildMatch(e);
  showCheck('Comprobar','primary','APP.check()',true);

function buildOrder(e){ ORDER={chosen:[],bank:e.items.map((t,idx)=>({t,idx})).sort(()=>Math.random()-.5)}; paintOrder(); }

function check(){ if(answered)return; const {e,ei}=CUR.exs[CUR.idx]; let correct=false;

  else if(e.type==='match'){ correct=e.pairs.every((p,idx)=>MATCH[idx]===p.r); document.querySelectorAll('#matchbox select').forEach((sel,idx)=>sel.classList.add(MATCH[idx]===e.pairs[idx].r?'correct':'wrong')); }
  else { // con opciones barajadas, la correcta es la posición donde quedó e.a
    const ans=e.type==='tf'?(e.a?0:1):(SHUF?SHUF.indexOf(e.a):e.a);
    correct=SEL===ans; document.querySelectorAll('#scr-lesson .opt').forEach(o=>{ const k=+o.dataset.k; o.classList.add('disabled'); if(k===ans)o.classList.add('correct'); else if(k===SEL)o.classList.add('wrong'); else o.classList.add('dim'); }); }
  if(!CUR.counted[ei]){ CUR.counted[ei]=true; if(!CUR.isReview){ const sk=e.skill||'general'; S.skill[sk]=S.skill[sk]||{ok:0,total:0}; S.skill[sk].total++; S.exCount++; if(correct){S.skill[sk].ok++;S.correctCount++;} }
    if(correct){ if(e.eth)S.ethCount++; } else if(!CUR.isReview){ const ref={li:CUR.li,lj:CUR.lj,ei}; if(!S.review.some(r=>r.li===ref.li&&r.lj===ref.lj&&r.ei===ref.ei)) S.review.push(ref);
      // Se apunta en qué pregunta exacta falló, para que el Comandante vea dónde se traba.
      const lec=CURRICULUM.levels[CUR.li].lessons[CUR.lj]; const kf=lec.id+'#'+ei;
      S.fails=S.fails||{}; S.fails[kf]={n:(S.fails[kf]&&S.fails[kf].n||0)+1,q:(e.q||e.title||'').slice(0,90),lec:lec.t,et:CURRICULUM.levels[CUR.li].etapa,t:Date.now()};
    } save(); }
  answered=true; hideCheck();
  if(correct){ sndGood(); burst(55);
    if(CUR.isReview&&CUR.exs[CUR.idx].ref){ const rf=CUR.exs[CUR.idx].ref; S.review=S.review.filter(r=>!(r.li===rf.li&&r.lj===rf.lj&&r.ei===rf.ei)); save(); }
    showFeedback(true,e.ok||"¡Correcto!",e.ex||e.why||"",()=>advance());
  } else { sndBad(); CUR.mistakes++; showFeedback(false,"Casi. Vuelve a intentarlo",e.ex||e.why||"Revisa bien las opciones.",()=>retry()); } }

function finishLesson(){
  if(CUR.isReview){ const jp=Math.random()<0.16; const gain=jp?16:8; addXP(gain); bumpStreak(); save(); refreshTop();
    if(jp) celebrate({icon:"🎰",title:"¡JACKPOT de repaso!",msg:fillN(CELEB_JACKPOT[(Math.random()*CELEB_JACKPOT.length)|0]),xp:"+"+gain+" XP",jackpot:true});
    else celebrate({icon:"🛩️",title:"¡Repaso superado!",msg:"Corregiste el rumbo como un piloto experto, "+pilotName()+".",xp:"+"+gain+" XP"});
    setTimeout(()=>{renderPath();show('path');},jp?2400:900); return; }
  const ls=CURRICULUM.levels[CUR.li].lessons[CUR.lj]; const first=!S.done[ls.id];

  let gain=CUR.mistakes===0?14:11; if(jackpot)gain*=2;
  if(first){ S.done[ls.id]=true; S.lessonsCount++; }
  const rankUp=addXP(first?gain:5); bumpStreak(); save(); refreshTop();
  const lv=CURRICULUM.levels[CUR.li];
  const moduleNow=first&&lv.lessons.every(l=>S.done[l.id])&&!S.moduleDone[lv.id];
  if(moduleNow){ S.moduleDone[lv.id]=true; save(); }
  if(jackpot) celebrate({icon:"🎰",title:"¡JACKPOT!",msg:fillN(CELEB_JACKPOT[(Math.random()*CELEB_JACKPOT.length)|0]),xp:"+"+gain+" XP",jackpot:true});
  else celebrate({icon:"✅",title:"¡Lección completada!",msg:randomCeleb(),xp:"+"+(first?gain:5)+" XP"});
  const delay=jackpot?2700:1200;
  setTimeout(()=>{ if(rankUp) celebrate({icon:"🎖️",title:"¡Ascenso a "+rankUp+"!",msg:rankReward(rankUp),xp:""}); },delay+50);
  const go=()=>{renderPath();show('path');};

/* Campana reconocible de fin de bloque (triple ding) */
function sndBell(){ if(S.muted)return; const c=ac(); if(!c)return; if(c.state==='suspended')c.resume(); let t=c.currentTime;
  for(let i=0;i<3;i++){ [1568,1047].forEach(f=>{ const o=c.createOscillator(),g=c.createGain(); o.type='sine'; o.frequency.value=f; g.gain.setValueAtTime(0,t); g.gain.linearRampToValueAtTime(.2,t+.01); g.gain.exponentialRampToValueAtTime(.0001,t+.5); o.connect(g); g.connect(c.destination); o.start(t); o.stop(t+.5); }); t+=.38; } }
